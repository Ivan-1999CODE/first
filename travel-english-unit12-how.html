const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fields=['before','after','home',...missions.map(m=>'mission-'+m.id),...pairs.map(p=>'note-'+p.id)];
const defaultState=()=>({answers:Object.fromEntries(fields.map(k=>[k,''])),checks:Object.fromEntries(pairs.map(p=>[p.id,p.goals.map(()=>false)])),ratings:Object.fromEntries(course.skills.map(s=>[s.id,0])),complete:[],home:{listen:false,written:false,spoken:false}});
let state=defaultState(),storageFailed=false;
function load(){try{const raw=localStorage.getItem(course.id);if(!raw)return;const saved=JSON.parse(raw);if(!saved||typeof saved!=='object')throw Error('invalid');for(const k of fields)if(typeof saved.answers?.[k]==='string')state.answers[k]=saved.answers[k];for(const p of pairs)if(Array.isArray(saved.checks?.[p.id]))state.checks[p.id]=p.goals.map((_,i)=>saved.checks[p.id][i]===true);for(const s of course.skills)if([0,1,2,3].includes(saved.ratings?.[s.id]))state.ratings[s.id]=saved.ratings[s.id];if(Array.isArray(saved.complete))state.complete=flows.map(f=>f.id).filter(id=>saved.complete.includes(id));for(const k of Object.keys(state.home))state.home[k]=saved.home?.[k]===true;}catch{storageFailed=true;}}
function save(){try{localStorage.setItem(course.id,JSON.stringify(state));}catch{storageFailed=true;showStorage();}}
function showStorage(){const n=$('#storageNotice');n.hidden=!storageFailed;if(storageFailed)n.textContent='此瀏覽器目前無法讀取或保存紀錄；你仍可練習，但關閉後可能不保留本次作答。';}
let page=0,mode='library',reply=0,mission=0,pair=0,flow=0,turn=0,history=[],heard=false,spoken=false,choice=-1,feedback='',finished=false;
let quizChoices={},toastTimer;
function stopAudio(){if(window.speechSynthesis)window.speechSynthesis.cancel();}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,5500);}
function speak(text,slow=false){stopAudio();if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){toast('此瀏覽器無法朗讀；請展開英文與中文，讀完後照樣能練習。');return;}try{const u=new window.SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=slow?.72:.94;u.onerror=()=>toast('朗讀未能播放；請展開英文與中文繼續。');window.speechSynthesis.speak(u);}catch{toast('朗讀未能播放；請展開英文與中文繼續。');}}
const btn=(text,data='',extra='')=>`<button type="button" ${data} ${extra}>${text}</button>`;
const audio=en=>`<div class="actions">${btn('▶ 聽英文',`data-say="${esc(en)}"`)}${btn('慢速',`data-say="${esc(en)}" data-slow="true"`)}</div>`;
const transcript=(en,zh)=>`<details><summary>對方英文與中文</summary><p class="en" lang="en">${esc(en)}</p><p>${esc(zh)}</p></details>`;
const hint=(words,answer)=>`<details><summary>需要一點關鍵字</summary><p class="hint" lang="en">${esc(words)}</p><details><summary>完整參考說法</summary><p class="en" lang="en">${esc(answer)}</p>${audio(answer)}<p class="fine">這是一種可用的說法，不必逐字相同。</p></details></details>`;
const field=(key,label)=>`<label for="field-${key}">${esc(label)}</label><textarea id="field-${key}" data-field="${key}" placeholder="單字、短句都可以，先留下自己的說法。">${esc(state.answers[key])}</textarea><p class="fine">輸入時自動保存在此瀏覽器；不同裝置、網址或瀏覽器不會自動同步。</p>`;
const check=(id,label,on,disabled=false)=>`<label class="checkline"><input type="checkbox" ${id} ${on?'checked':''} ${disabled?'disabled':''}> <span>${esc(label)}</span></label>`;
const tabs=(items,key,current)=>`<div class="tabs" aria-label="情境選擇">${items.map((x,i)=>btn(esc(x.name),`data-${key}="${i}"`,`aria-pressed="${i===current}"`)).join('')}</div>`;
const head=(sub,desc)=>`<div class="eyebrow">DAY 12 / ${String(page+1).padStart(2,'0')}</div><h1>${esc(course.labels[page])}</h1><p class="lead muted">${esc(desc||sub)}</p>`;
function selected(id){const n=flows[flow].steps.findIndex(t=>t.id===id);return history[n];}
function accepted(t,i){return Number.isInteger(i)&&t.valid.includes(i);}
function canNext(){return !finished&&heard&&spoken&&accepted(currentStep(),choice);}
function missionPage(){const m=missions[mission];return head('','先說，再記下自己的版本。不需要重走完整流程。')+tabs(missions,'mission',mission)+`<div class="grid"><section class="panel"><h2>${esc(m.name)}</h2><p class="task">${esc(m.task)}</p>${hint(m.words,m.answer)}</section><section class="panel">${field('mission-'+m.id,'我的說法')}<p class="hint">一起核對：${esc(m.check)}</p></section></div>`;}
function pairPage(){const p=pairs[pair];return head('', '師生共看同一個畫面，自然接話；目標不必依清單順序完成。')+tabs(pairs,'pair',pair)+`<p>${esc(p.role)}</p><div class="role-grid"><section class="panel"><h2>${esc(p.name)}</h2><div class="scene-state">${esc(p.objects)}</div><h3>① ${p.first}先說</h3><p class="task">「${esc(p.opening)}」</p><p class="fine">請用自己的英文表達，不必逐字翻譯。</p><h3>② 接著怎麼做</h3><p>${esc(p.next)}</p><div class="section-title"><h3>這次要完成的事</h3><span id="pairProgress">${state.checks[p.id].filter(Boolean).length} / ${p.goals.length} 項已做到</span></div>${p.goals.map((g,i)=>check(`data-pair-check="${p.id}:${i}"`,g,state.checks[p.id][i])).join('')}<p class="fine">完成目標：把以上溝通需求說清楚。老師依實際表達勾選，也能取消。</p>${field('note-'+p.id,'記下一句真正用到的英文')}</section><details class="teacher"><summary>老師引導（共看，非私密）</summary><h3>先確認起點</h3><p>${p.first}先說：「${esc(p.opening)}」</p>${p.start?`<p class="en" lang="en">${esc(p.start)}</p>${audio(p.start)}`:'<p>先等待學生開口。</p>'}<p class="hint">${esc(p.tags)}</p><h3>聽到學生……你可以接</h3><p class="fine">找符合當下的一張，不必逐卡照念。</p>${p.cards.map(([trigger,line,zh])=>`<div class="teacher-card"><b>${esc(trigger)} →</b><p class="en" lang="en">${esc(line)}</p><p>${esc(zh)}</p>${audio(line)}</div>`).join('')}<details><summary>學生卡住了</summary><p>先問：「現在想讓對方知道什麼？」接受單字或短句，再用關鍵字協助。</p>${hint(p.words,p.answer)}</details><details><summary>帶領小提醒與完整條件</summary><p>${esc(p.tags)}。回應以學生實際說法為準，已說清楚的資訊不必重問。請留空間讓學生先開口，依學生所選景點提供對應資訊，改變行程也可以完成溝通。</p></details></details></div>`;}
const ratingNames=['尚未自評','看完整範例','看關鍵字','能獨立完成'];
function progressPage(){return head('', '回到同一道題，看見自己現在能說清楚的事。')+`<section class="panel"><h2>回到同一題</h2><p class="task">${esc(course.task)}</p>${hint(course.words,course.answer)}<div class="grid"><div><h3>第一次的我</h3><div class="readonly">${state.answers.before?esc(state.answers.before):'尚無課前紀錄。可以回第一部分留下自己的嘗試。'}</div></div><div>${field('after','現在的我')}</div></div><p class="hint">一起核對：${esc(course.check)}</p></section><section class="panel"><h2>現在的我，能做到哪一步？</h2><p>選這次實際需要的協助；看過提示不會自動替你評級。</p>${course.skills.map(s=>{const r=state.ratings[s.id];return `<div class="rating" data-level="${r}"><h3>${esc(s.text)}</h3><div class="meter" aria-label="${ratingNames[r]}${r?'，'+r+' / 3 格':''}">${[1,2,3].map(n=>`<span class="${r>=n?(r===3?'green':'yellow'):''}"></span>`).join('')}</div><p>${ratingNames[r]}${r?' · '+r+' / 3 格':''}</p><div class="actions">${[1,2,3].map(n=>btn(`${ratingNames[n]}<small>${['','有完整句子，我能跟著表達。','給我幾個詞，我能自己組句。','不看提示，我也能說清楚。'][n]}</small>`,`data-rating="${s.id}:${n}"`,`aria-pressed="${r===n}"`)).join('')}</div></div>`;}).join('')}</section><section class="panel"><h2>留下一句具體回饋。</h2><p>老師與學生一起找出：這次做到了什麼，下次要多練習哪一步。</p></section>`;}
function homePage(){return head('', '先聽懂，再說自己的版本。答錯可以重選，沒有次數限制。')+`<div class="grid"><section class="panel"><h2>1. 聽懂關鍵資訊</h2>${quizzes.map((q,i)=>`<section style="margin:24px 0"><h3>${i+1}. ${esc(q.task)}</h3>${audio(q.line)}${transcript(q.line,q.zh)}<div class="actions">${q.options.map((o,j)=>btn(esc(o),`data-quiz="${q.id}:${j}"`,`aria-pressed="${quizChoices[q.id]===j}"`)).join('')}</div><div role="status">${quizChoices[q.id]!==undefined?`<p class="feedback ${quizChoices[q.id]===q.correct?'':'retry'}">${quizChoices[q.id]===q.correct?'✓ '+esc(q.why):'再聽一次，留意每隔多久、還要等多久、車程或總價；也可以打開逐字稿再選。'}</p>`:''}</div></section>`).join('')}${check('data-home="listen"','我已練習聽懂關鍵資訊',state.home.listen)}</section><section class="panel"><h2>2. 說自己的版本</h2><p class="task">${esc(homeTask)}</p>${field('home','我的旅遊英文')}${hint(homeWords,homeAnswer)}${check('data-home="written"','我已寫下自己的版本',state.home.written)}${check('data-home="spoken"','我已收起提示，大聲說一次',state.home.spoken)}<p id="homeProgress" class="status">${homeProgress()}</p><p class="fine">勾選表示你已練習，不是自動評分。</p></section></div>`;}
function homeProgress(){const n=Object.values(state.home).filter(Boolean).length;return `已練習 ${n} / ${Object.keys(state.home).length} 項${n===Object.keys(state.home).length?' · 課後挑戰完成 ✓':''}`;}
function render(){const views=[intro,phrasePage,scenePage,missionPage,pairPage,progressPage,homePage];$('#main').innerHTML=views[page]()+`<div class="footer-actions">${btn('← 上一部分',`data-page="${page-1}"`,page===0?'disabled':'')}${btn(page===6?'回到課前首頁':'下一部分 →',`data-page="${page===6?0:page+1}"`)}</div>`;$('#nav').innerHTML=course.labels.map((t,i)=>btn(`<span class="number">${String(i+1).padStart(2,'0')}</span>${esc(t)}`,`data-page="${i}"`,i===page?'aria-current="step"':'')).join('');showStorage();}
function focusMain(){ $('#main').focus({preventScroll:true}); }
function navigate(p){if(!Number.isInteger(p)||p<0||p>=course.labels.length)return;stopAudio();page=p;render();if(window.matchMedia('(max-width:1100px)').matches)$('#courseMenu').open=false;focusMain();window.scrollTo({top:0,behavior:'instant'});}
function resetTurn(){heard=false;spoken=false;choice=-1;feedback='';}
function start(i){if(!flows[i])return;flow=i;turn=0;history=[];finished=false;resetTurn();navigate(2);}
function choose(i){const t=currentStep();if(finished||!heard||!spoken||!Number.isInteger(i)||!t.objects[i])return;choice=i;history=history.slice(0,turn);if(accepted(t,i)){history[turn]=i;feedback=t.effect;}else feedback='再試一次：'+(t.retry||'這個操作不符合目前的需要。重看中文任務，或重聽對方的話。');render();$(`[data-choice="${i}"]`).focus({preventScroll:true});}
function next(){if(!canNext())return;stopAudio();if(turn===flows[flow].steps.length-1){finished=true;if(!state.complete.includes(flows[flow].id))state.complete.push(flows[flow].id);save();}else{turn++;resetTurn();}render();focusMain();}
function back(){if(turn===0||finished)return;stopAudio();turn--;history=history.slice(0,turn);resetTurn();render();focusMain();}
function appearance(){const dark=document.documentElement.dataset.theme==='dark',large=document.documentElement.dataset.size==='large';$('#theme').textContent=dark?'☀ 淺色':'☾ 深色';$('#theme').setAttribute('aria-label',dark?'切換為淺色模式':'切換為深色模式');$('#theme').setAttribute('aria-pressed',String(dark));$('#large').textContent=large?'標準文字':'放大文字';$('#large').setAttribute('aria-pressed',String(large));}
document.addEventListener('input',e=>{const key=e.target.dataset.field;if(fields.includes(key)){state.answers[key]=e.target.value;save();}});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.pairCheck){const [id,i]=d.pairCheck.split(':'),p=pairs.find(p=>p.id===id);if(!p||!p.goals[+i])return;state.checks[id][+i]=e.target.checked;save();$('#pairProgress').textContent=`${state.checks[id].filter(Boolean).length} / ${p.goals.length} 項已做到`;return;}if(d.home&&Object.hasOwn(state.home,d.home)){state.home[d.home]=e.target.checked;save();$('#homeProgress').textContent=homeProgress();return;}if(['heard','spoken'].includes(e.target.id)){const id=e.target.id;if(id==='heard')heard=e.target.checked;else spoken=heard&&e.target.checked;if(!heard)spoken=false;choice=-1;feedback='';history=history.slice(0,turn);render();$('#'+id).focus({preventScroll:true});}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.say)return speak(d.say,d.slow==='true');if(d.page!==undefined)return navigate(+d.page);if(d.start!==undefined)return start(+d.start);if(d.choice!==undefined)return choose(+d.choice);if(d.act==='next')return next();if(d.act==='back')return back();if(d.mode&&['library','reply'].includes(d.mode)){stopAudio();mode=d.mode;render();$(`[data-mode="${mode}"]`).focus({preventScroll:true});return;}for(const key of ['reply','mission','pair'])if(d[key]!==undefined){const n=+d[key],list={reply:replies,mission:missions,pair:pairs}[key];if(!Number.isInteger(n)||!list[n])return;stopAudio();if(key==='reply')reply=n;if(key==='mission')mission=n;if(key==='pair')pair=n;render();$(`[data-${key}="${n}"]`).focus({preventScroll:true});return;}if(d.rating){const [id,n]=d.rating.split(':');if(!course.skills.some(s=>s.id===id)||![1,2,3].includes(+n))return;state.ratings[id]=+n;save();render();$(`[data-rating="${d.rating}"]`).focus({preventScroll:true});return;}if(d.quiz){const [id,n]=d.quiz.split(':'),q=quizzes.find(q=>q.id===id);if(!q||!q.options[+n])return;quizChoices[id]=+n;render();$(`[data-quiz="${d.quiz}"]`).focus({preventScroll:true});return;}if(b.id==='theme'||b.id==='large'){const theme=b.id==='theme',key=theme?'theme':'size',active=theme?'dark':'large',other=theme?'light':'standard';document.documentElement.dataset[key]=document.documentElement.dataset[key]===active?other:active;appearance();try{localStorage.setItem(theme?'travel-lab-theme':'travel-lab-text-size',document.documentElement.dataset[key]);}catch{toast('目前無法保存外觀設定，但本次切換仍有效。');}}});
window.addEventListener('pagehide',stopAudio);
load();render();appearance();
const compact=window.matchMedia('(max-width:1100px)');
const menuSync=()=>{$('#courseMenu').open=!compact.matches;};menuSync();compact.addEventListener('change',menuSync);
</script><script id="lesson-controls">
// Shared controls embedded in each lesson's app script.
(() => {
 let showChinese=false;
 const originalRender=render;
 const translations=()=>Array.from(document.querySelectorAll('#main details')).filter(el=>/中文/.test(el.querySelector('summary')?.textContent||''));
 function updateLabel(){
  const button=document.querySelector('#allChinese');
  if(!button)return;
  const items=translations(),all=items.length>0&&items.every(el=>el.open);
  button.textContent=all?'收起全部中文':'展開全部中文';
  button.setAttribute('aria-expanded',String(all));
 }
 function decorate(){
  const main=document.querySelector('#main');
  main.classList.toggle('lesson-phrase-page',page===1);
  if(page!==1)return;
  const heading=main.querySelector('h1');
  if(!heading)return;
  // Keep the same reading order in phrase cards and listening questions.
  translations().forEach(details=>{
   const parent=details.parentElement;
   const audio=Array.from(parent.children).find(el=>el.classList.contains('actions')&&el.querySelector('button'));
   if(!audio)return;
   const english=details.querySelector(':scope > p[lang="en"]')||parent.querySelector(':scope > p[lang="en"]');
   if(!english)return;
   audio.before(english);
   audio.after(details);
   english.classList.add('lesson-phrase-english');
   audio.classList.add('lesson-phrase-audio');
   details.classList.add('lesson-phrase-chinese');
   details.querySelector('summary').textContent='看中文意思';
  });
  const row=document.createElement('div');row.className='translation-heading';
  heading.before(row);row.append(heading);
  const button=document.createElement('button');button.id='allChinese';button.type='button';
  button.addEventListener('click',()=>{
   const items=translations();showChinese=!items.every(el=>el.open);
   items.forEach(el=>el.open=showChinese);updateLabel();
  });
  row.append(button);
  translations().forEach(el=>{el.open=showChinese;el.addEventListener('toggle',updateLabel);});
  updateLabel();
 }
 render=function(...args){originalRender(...args);decorate();};
 const style=document.createElement('style');
 style.textContent='.translation-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}.translation-heading h1{flex:1;min-width:min(100%,240px)}.translation-heading button{flex-shrink:0;min-height:44px;margin-left:auto}.lesson-audio-status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:1000;max-width:calc(100% - 32px);width:max-content;background:#202631;color:#fff;padding:12px 20px;border-radius:14px;box-shadow:0 4px 20px #0003}';
 document.head.append(style);
 const typography=document.createElement('style');
 typography.textContent=`
 #main.lesson-phrase-page{--lesson-text-size:17px;font-size:var(--lesson-text-size);line-height:1.7}
 :root[data-size=large] #main.lesson-phrase-page,body.large #main.lesson-phrase-page{--lesson-text-size:20px}
 #main.lesson-phrase-page .lesson-phrase-english{font-size:calc(var(--lesson-text-size)*1.28);line-height:1.6;font-weight:400;letter-spacing:normal;margin:0 0 18px;overflow-wrap:anywhere}
 #main.lesson-phrase-page .lesson-phrase-audio{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 16px}
 #main.lesson-phrase-page .lesson-phrase-audio button,#main.lesson-phrase-page .lesson-phrase-chinese{font-size:var(--lesson-text-size);line-height:1.7}
 #main.lesson-phrase-page .lesson-phrase-chinese{margin:0}
 #main.lesson-phrase-page .lesson-phrase-chinese summary,#main.lesson-phrase-page .lesson-phrase-chinese p:not(.fine){font-size:var(--lesson-text-size);line-height:1.7}
 @media(max-width:700px){#main.lesson-phrase-page .lesson-phrase-english{font-size:calc(var(--lesson-text-size)*1.2)}}
 `;
 document.head.append(typography);
 const status=document.createElement('div');status.className='lesson-audio-status';status.role='status';status.setAttribute('aria-live','polite');status.hidden=true;document.body.append(status);
 let current=null,version=0,watchdog=0,messageTimer=0;
 const message=(text,sticky=false)=>{clearTimeout(messageTimer);status.textContent=text;status.hidden=!text;if(text&&!sticky)messageTimer=setTimeout(()=>status.hidden=true,7000);};
 stopAudio=function(){
  version++;clearTimeout(watchdog);current=null;
  if(window.speechSynthesis)window.speechSynthesis.cancel();
  message('');
 };
 speak=function(text,slow=false){
  stopAudio();
  const synth=window.speechSynthesis;
  if(!synth||!window.SpeechSynthesisUtterance){message('此瀏覽器不支援朗讀。請改用 Edge 或 Chrome，或展開中文與英文繼續練習。');return;}
  const token=version;
  const voices=synth.getVoices().filter(v=>/^en(?:[-_]|$)/i.test(v.lang)).sort((a,b)=>Number(b.localService)-Number(a.localService));
  const candidates=voices.length?voices.slice(0,2):[null];
  function play(attempt){
   if(token!==version)return;
   clearTimeout(watchdog);
   const utterance=new window.SpeechSynthesisUtterance(text);current=utterance;
   utterance.lang=candidates[attempt]?.lang||'en-US';
   const normalRate=.9;
   utterance.rate=normalRate*(slow?.8:1);
   if(candidates[attempt])utterance.voice=candidates[attempt];
   const active=()=>token===version&&current===utterance;
   function failed(error){
    if(!active())return;
    clearTimeout(watchdog);current=null;
    if(['interrupted','canceled'].includes(error)){message('');return;}
    synth.cancel();
    if(attempt+1<candidates.length){play(attempt+1);return;}
    message('語音未能播放。請確認裝置音量，或換用 Edge／Chrome 重試；也可展開英文與中文繼續練習。');
   }
   utterance.onstart=()=>{if(active()){clearTimeout(watchdog);message(slow?'正在慢速朗讀…':'正在朗讀…',true);}};
   utterance.onend=()=>{if(active()){clearTimeout(watchdog);current=null;message('');}};
   utterance.onerror=e=>failed(e.error);
   message('正在準備朗讀…',true);
   watchdog=setTimeout(()=>failed('timeout'),5000);
   try{if(synth.paused)synth.resume();synth.speak(utterance);}catch{failed('synthesis-failed');}
  }
  play(0);
 };
 window.addEventListener('pagehide',()=>stopAudio());
 decorate();
})();
</script>
