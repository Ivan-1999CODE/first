<style id="course-palette-styles">

:root[data-course-palette=apricot]{--course-hue:30;--course-saturation:54%}
:root[data-course-palette=butter]{--course-hue:46;--course-saturation:52%}
:root[data-course-palette=rose]{--course-hue:350;--course-saturation:34%}

:root[data-course-palette][data-theme=light]{
 --bg:hsl(var(--course-hue) var(--course-saturation) 94%);
 --panel:hsl(var(--course-hue) 35% 99%);

 --ink:hsl(var(--course-hue) 30% 94%);

<style id="responsive-layout-styles">

function lessonStep(f,index,get){
 const t={...f.steps[index]};
 if(course.day===2&&f.id==='clothes'){
  const color=get('color')===1?'green':'black',zh=color==='green'?'綠色':'黑色';
  if(t.id==='decision'){t.line=`The ${color} T-shirt in medium is twenty dollars. Would you like to take it?`;t.zh=`這件${zh} M 號 T-shirt 是 20 美元，你想買嗎？`;t.answer=`The ${color} one fits. I’ll take it.`;}
  if(t.id==='payment'&&get('decision')===1){t.line='No problem. Have a nice day!';t.zh='沒問題，祝你有美好的一天！';t.task='你已決定不買，禮貌謝謝店員並離開。';t.words='thank you';t.answer='Thank you. Have a nice day!';t.objects=[['↗','謝謝店員，離開商店']];t.valid=[0];}
 }
 if(course.day===2&&f.id==='gift'&&t.id==='finish'){
  const item=get('alternative')===1?'postcard':'magnet',price=get('alternative')===1?'two':'four';
  t.line=`Here’s your ${item} and your receipt for ${price} dollars. Thank you!`;
  t.zh=`這是你的${item==='postcard'?'明信片':'磁鐵'}與 ${price==='two'?2:4} 美元收據。謝謝！`;
 }
 return t;
}
function lessonScene(f,values,done){
 const get=id=>values[f.steps.findIndex(t=>t.id===id)];
 if(course.day===1){
  const j=get('junction'),turned=get('turn')!==undefined,y=j===undefined?315:j===0?215:90,x=turned?(f.side==='left'?85:335):210;
  const path=j===undefined?'':`<polyline points="210,315 210,${y}${turned?' '+x+','+y:''}" fill="none" stroke="#c47c20" stroke-width="8" stroke-linejoin="round"/>`;
  return `<div class="scene-state"><h3>${esc(f.destination)} · ${done?'✓ 已確認路線':'問路中'}</h3><svg class="lesson-map" viewBox="0 0 420 370" role="img" aria-label="教學地圖，起點朝北，${turned?'已標記到'+f.destination:'目前直走到'+(j===undefined?'起點':j===0?'第一個路口':'第二個路口')}"><rect width="420" height="370" rx="16" fill="#e4eee7"/><path d="M45 90H375M45 215H375M210 45V330" stroke="#fff" stroke-width="26"/>${path}${[[85,90,'火車站'],[335,90,'郵局'],[85,215,'公車站'],[335,215,'警局']].map(([a,b,name])=>`<g><rect x="${a-55}" y="${b-48}" width="110" height="38" rx="8" fill="${name===f.destination?'#146f63':'#5c7069'}"/><text x="${a}" y="${b-23}" text-anchor="middle" fill="white" font-size="15">${name}</text></g>`).join('')}<circle cx="${x}" cy="${y}" r="12" fill="#c47c20" stroke="white" stroke-width="3"/><text x="228" y="155" font-size="14" fill="#294c43">第二個路口 ↑</text><text x="228" y="273" font-size="14" fill="#294c43">第一個路口 ↑</text><text x="210" y="353" text-anchor="middle" font-size="15" fill="#294c43">起點 · 面朝北 ↑</text></svg><p>目前：${j===undefined?'起點':`第 ${j+1} 個路口`}${turned?' → '+(f.side==='left'?'左轉':'右轉')+' → '+esc(f.destination):''}</p><p>步行資訊：${get('walk')===undefined?'待詢問':f.walkMinutes+' 分鐘'}</p></div>`;
 }
 const clothes=f.id==='clothes',chosen=get(clothes?'color':'alternative'),buy=get('decision'),payment=get('payment');
 const item=clothes?(get('item')===undefined?'待選商品':chosen===undefined?'T-shirt':chosen===1?'綠色 T-shirt':'黑色 T-shirt'):(chosen===undefined?'待選禮物':chosen===1?'明信片':'磁鐵');
 const price=clothes?(chosen===undefined?'待詢問':'$20'):(chosen===undefined?'待選擇':chosen===1?'$2':'$4');
 const status=clothes&&buy===1?'這次不購買':done?'✓ 已完成購買':'選購中';
 const color=clothes&&chosen===1?'#39846b':'#343b40';
 const art=clothes?`<svg viewBox="0 0 240 155" role="img" aria-label="${esc(item)}"><path d="m75 20-45 35 30 33 20-18v70h80V70l20 18 30-33-45-35-25 12h-40z" fill="${color}" stroke="#afbbb6" stroke-width="3"/><text x="120" y="92" text-anchor="middle" fill="white" font-size="32">${get('size')===undefined?'?':'M'}</text></svg>`:`<div class="visual" aria-hidden="true">${chosen===undefined?'🎁':chosen===1?'✉':'🧲'}</div>`;
 return `<div class="scene-state"><div class="ticket-title"><span>MY ${clothes?'SHOPPING':'GIFT'}</span><b>${status}</b></div>${art}<div class="receipt-row"><span>商品</span><strong>${item}</strong></div><div class="receipt-row"><span>${clothes?'尺寸':'預算'}</span><strong>${clothes?(get('size')===undefined?'待確認':'M'):'$10'}</strong></div><div class="receipt-row"><span>價格</span><strong>${price}</strong></div><div class="receipt-row"><span>付款</span><strong>${clothes&&buy===1?'不需付款':payment===undefined?'待確認':payment===0?'刷卡':'現金'}</strong></div>${done&&!(clothes&&buy===1)?'<p>🛍 商品與收據已交到你手上。</p>':''}</div>`;
}

// Match the shared workshop card used by Days 3–6; retain Day 1–2 data and navigation.
function replyCard(r){
 return `<div class="workshop-picker" role="group" aria-label="選擇問答情境">${replies.map((q,i)=>btn(`${i+1}. ${esc(q.name)}`,`data-reply="${i}"`,`aria-pressed="${reply===i}"`)).join('')}</div>
 <section class="panel workshop-card" aria-labelledby="workshopHeading">
 <div class="workshop-card-top"><h2 id="workshopHeading" tabindex="-1">${esc(r.name)}</h2><span class="workshop-count">${reply+1} / ${replies.length}</span></div>
 <div class="workshop-body"><div class="workshop-question">
 <div class="workshop-role"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="25" cy="20" r="10"/><path d="M7 57v-9c0-18 36-18 36 0v9M41 8h18v16H47l-6 6V8"/><path d="M46 14h8m-8 5h5"/></svg><span>${esc(course.replyRole)}問你</span></div>
 ${audio(r.line)}${transcript(r.line,r.zh)}<p class="fine">聽懂問題就好，不必背誦對方的台詞。</p>
 </div><div class="workshop-answer"><p class="eyebrow">YOUR TURN / 換你回答</p><h3>先試著說，不急著看答案。</h3><p class="task">${esc(r.task)}</p>${hint(r.words,r.answer)}
 <div class="workshop-remix"><h3>換成你的答案</h3><p>${esc(r.change)}</p>${hint(r.changeWords,r.changeAnswer)}</div>
 <p class="fine">單字或短句都可以，說得通即可；這裡不錄音，也不自動評分。</p></div></div>
 <div class="lesson-footer">${btn('← 上一組',`data-reply="${reply-1}"`,reply===0?'disabled':'')}${reply<replies.length-1?btn('下一組 →',`data-reply="${reply+1}"`):btn('進入互動流程 →','data-page="2"')}</div></section>`;
}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fields=['before','after','home',...missions.map(m=>'mission-'+m.id),...pairs.map(p=>'note-'+p.id)];
const defaultState=()=>({answers:Object.fromEntries(fields.map(k=>[k,''])),checks:Object.fromEntries(pairs.map(p=>[p.id,p.goals.map(()=>false)])),ratings:Object.fromEntries(course.skills.map(s=>[s.id,0])),complete:[],home:{listen:false,written:false,spoken:false}});
let state=defaultState(),storageFailed=false;
function load(){try{const raw=localStorage.getItem(course.id);if(!raw){migrateLegacy();return;}const saved=JSON.parse(raw);if(!saved||typeof saved!=='object'||Array.isArray(saved))throw Error('invalid');if(saved.legacy&&typeof saved.legacy==='object')state.legacy=saved.legacy;for(const k of fields)if(typeof saved.answers?.[k]==='string')state.answers[k]=saved.answers[k];for(const p of pairs)if(Array.isArray(saved.checks?.[p.id]))state.checks[p.id]=p.goals.map((_,i)=>saved.checks[p.id][i]===true);for(const s of course.skills)if([0,1,2,3].includes(saved.ratings?.[s.id]))state.ratings[s.id]=saved.ratings[s.id];if(Array.isArray(saved.complete))state.complete=flows.map(f=>f.id).filter(id=>saved.complete.includes(id));for(const k of Object.keys(state.home))state.home[k]=saved.home?.[k]===true;}catch{storageFailed=true;}}
function migrateLegacy(){for(const key of course.legacyKeys){const raw=localStorage.getItem(key);if(!raw)continue;const old=JSON.parse(raw);if(!old||typeof old!=='object'||Array.isArray(old))continue;state.legacy=old;if(typeof old.before==='string')state.answers.before=old.before;break;}}
function save(){try{localStorage.setItem(course.id,JSON.stringify(state));}catch{storageFailed=true;showStorage();}}
function showStorage(){const n=$('#storageNotice');n.hidden=!storageFailed;if(storageFailed)n.textContent='此瀏覽器目前無法讀取或保存紀錄；你仍可練習，但關閉後可能不保留本次作答。';}

function missionPage(){const m=missions[mission];return head('','先說，再記下自己的版本。不需要重走完整流程。')+tabs(missions,'mission',mission)+`<div class="grid"><section class="panel"><h2>${esc(m.name)}</h2><p class="task">${esc(m.task)}</p>${hint(m.words,m.answer,m.answerZh)}</section><section class="panel">${field('mission-'+m.id,'我的說法')}<p class="hint">一起核對：${esc(m.check)}</p></section></div>`;}

function navigate(p){if(!Number.isInteger(p)||p<0||p>=course.labels.length)return;stopAudio();page=p;render();if(window.matchMedia('(max-width:1100px)').matches)$('#courseMenu').open=false;focusMain();const title=$('#main h1')||$('#main');const inset=($('.top')?.getBoundingClientRect().height||0)+16;window.scrollTo({top:Math.max(0,window.scrollY+title.getBoundingClientRect().top-inset),behavior:'instant'});}

function appearance(){const dark=document.documentElement.dataset.theme==='dark',large=document.documentElement.dataset.size==='large';$('#theme').textContent=dark?'☀ 淺色':'☾ 深色';$('#theme').setAttribute('aria-label',dark?'切換為淺色模式':'切換為深色模式');$('#theme').setAttribute('aria-pressed',String(dark));$('#large').textContent=large?'標準文字':'放大文字';$('#large').setAttribute('aria-pressed',String(large));}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.say)return speak(d.say,d.slow==='true');if(d.page!==undefined)return navigate(+d.page);if(d.start!==undefined)return start(+d.start);if(d.choice!==undefined)return choose(+d.choice);if(d.act==='next')return next();if(d.act==='back')return back();if(d.mode&&['library','reply'].includes(d.mode)){stopAudio();mode=d.mode;render();($(`[data-mode="${mode}"]`)||$("#main")).focus({preventScroll:true});return;}for(const key of ['reply','mission','pair'])if(d[key]!==undefined){const n=+d[key],list={reply:replies,mission:missions,pair:pairs}[key];if(!Number.isInteger(n)||!list[n])return;stopAudio();if(key==='reply')reply=n;if(key==='mission')mission=n;if(key==='pair')pair=n;render();$(`[data-${key}="${n}"]`).focus({preventScroll:true});return;}if(d.rating){const [id,n]=d.rating.split(':');if(!course.skills.some(s=>s.id===id)||![1,2,3].includes(+n))return;state.ratings[id]=+n;save();render();$(`[data-rating="${d.rating}"]`).focus({preventScroll:true});return;}if(d.quiz){const [id,n]=d.quiz.split(':'),q=quizzes.find(q=>q.id===id);if(!q||!q.options[+n])return;quizChoices[id]=+n;render();$(`[data-quiz="${d.quiz}"]`).focus({preventScroll:true});return;}if(b.id==='theme'||b.id==='large'){const theme=b.id==='theme',key=theme?'theme':'size',active=theme?'dark':'large',other=theme?'light':'standard';document.documentElement.dataset[key]=document.documentElement.dataset[key]===active?other:active;appearance();try{localStorage.setItem(theme?'travel-lab-theme':'travel-lab-text-size',document.documentElement.dataset[key]);}catch{toast('目前無法保存外觀設定，但本次切換仍有效。');}}});

function guidedFlowTurns(t,readingHtml='',header=flowRoleHeader){
 const locked=t.askFirst&&!spoken,selfLocked=!t.askFirst&&!heard;
 const selfFirst=(course.day===1||typeof microVersion==='number')&&t.askFirst;
 const turnClass=(waiting,done)=>` flow-turn turn-${waiting?'waiting':done?'done':'current'}`;
 const turnStatus=(waiting,done,me)=>`<p class="turn-status">${waiting?'等待中 · 請先完成第 1 步':done?'✓ 已完成此步':me?'現在輪到你 · 說完再勾選':'現在聽對方 · 聽完或讀完再勾選'}</p>`;
 const speaker=`<section class="role-frame role-other${turnClass(locked,heard)}" aria-label="${esc(course.replyRole)}會說的話">${header(false,`${t.askFirst?'回覆你':'先聽'} · ${course.replyRole}會說的話`,'聽懂這次需要的資訊即可。',t.askFirst?2:1)}${turnStatus(locked,heard,false)}${locked?`<p class="listen-locked">先完成${selfFirst?'上方':'下方'}的開口並勾選，再播放對方回覆。需要時，可自行展開台詞與中文。</p>`:audio(t.line)}${flowTranscript(t.line,t.zh,readingHtml)}${check('id="heard"',locked?`尚未輪到 · 先完成${selfFirst?'上方':'下方'}的開口確認`:'我已聽完，或已讀完逐字稿',heard,locked)}</section>`;
 const self=`<section class="role-frame role-self${turnClass(selfLocked,spoken)}" aria-label="我需要說的話">${header(true,t.askFirst?'我先開口':'換我回答','↓ 看這裡，換你說',t.askFirst?1:2)}${turnStatus(selfLocked,spoken,true)}<div class="speaking-task"><p class="task">${esc(t.task)}</p>${hint(t.words,t.answer)}</div>${check('id="spoken"',selfLocked?'尚未輪到 · 先完成上方的聽讀確認':'我已用自己的聲音說',spoken,selfLocked)}</section>`;
 if(selfFirst)return `${self}<div class="dialogue-link" aria-hidden="true">↓ 說完以後，聽對方回覆</div>${speaker}`;
 return `${speaker}<div class="dialogue-link" aria-hidden="true">${t.askFirst?'↑ 先從下方開口，再聽回覆':'↓ 聽過以後，換我說'}</div>${self}`;
}

// Read-only rehearsal: derive the actual speaker order from the authored steps.
// It shares the existing audio controls and does not change learning records.
function dialoguePreview({steps,role,task,title='對話怎麼接？先照順序看一遍',className='micro-example',prelude,kind='primary'}){
 const lang=typeof language==='string'?language:'en';
 let number=0;
 const turn=(speaker,text,zh,speakerRole=role)=>{
  const n=++number,who=speaker==='self'?'我 · 旅客':speakerRole;
  return `<li class="micro-turn" data-speaker="${speaker}"><div class="micro-turn-label"><span class="micro-turn-number">${n}</span><strong>${esc(who)}</strong></div><p class="en" lang="${lang}">${esc(text)}</p><p class="micro-turn-meaning">${esc(zh)}</p>${lang!=='en'&&typeof reading==='function'?reading(text):''}${audio(text)}</li>`;
 };
 let opening='';
 if(prelude){
  opening=`<div class="micro-dialogue micro-prelude"><ol class="micro-turns">${turn('other',prelude.line,prelude.zh)}<li class="micro-turn micro-turn-action" data-speaker="action"><div class="micro-turn-label"><span class="micro-turn-number">${++number}</span><strong>我 · 指出目的地</strong></div><p>${esc(prelude.task)}</p></li></ol></div>`;
 }
 const dialogue=steps.map((s,i)=>{
  const start=number+1;
  const self=()=>turn('self',s.answer,s.answerZh),other=()=>turn('other',s.line,s.zh,s.role||role);
  const scene=s.sceneTitle||s.sceneContext?`<header class="dialogue-scene"><h3>${esc(s.sceneTitle||'接著練習')}</h3>${s.sceneContext?`<p>${esc(s.sceneContext)}</p>`:''}${s.role?`<p class="fine">我與${esc(s.role)}接話</p>`:''}</header>`:'';
  return `${scene}<div class="micro-dialogue" data-exchange="${i}"${s.sourceTaskId?` data-source-task="${esc(s.sourceTaskId)}"`:''}><ol class="micro-turns" start="${start}">${s.askFirst?self()+other():other()+self()}</ol></div>`;
 }).join('');
 return `<section class="panel dialogue-preview ${className}" data-example-kind="${kind}"><p class="eyebrow">本輪對話示範 · 按順序接話</p><h2>${esc(title)}</h2><p class="micro-example-context">${esc(task)}</p>${opening}${dialogue}<p class="fine">先照順序讀一遍，再和老師分角色練。每次只練這個情境；熟悉後收起範例，用自己的聲音說。</p></section>`;
}

  const index=interactive?t.mapChoices.indexOf(id):-1;
  const selected=index>=0&&capstoneState.choice===index;
  const classes=`cap-place cap-place-${id}${(id==='station'&&located)||(id==='bus'&&bus)?' cap-known':''}${selected?' cap-selected':''}`;
  const content=`<span class="cap-place-symbol" aria-hidden="true">${symbol}</span><span>${label}</span>${selected?`<span class="cap-place-result">${index===t.correct?'✓ 已確認':'再試一次'}</span>`:''}`;
  return index>=0?capButton(content,`data-cap-choice="${index}"`,`class="${classes}" aria-label="${esc(t.options[index])}" aria-pressed="${selected}" ${capstoneState.heard?'':'disabled'}`):`<div class="${classes}">${content}</div>`;
 }).join('');
 return `<div class="cap-map" role="group" aria-label="教學示意地圖，面朝上：火車站在右前方，郵局在左前方，公車站牌在左側。"><svg viewBox="0 0 440 230" preserveAspectRatio="none" aria-hidden="true"><rect class="cap-block" x="25" y="101" width="128" height="60" rx="14"/><rect class="cap-block" x="285" y="101" width="130" height="60" rx="14"/><path class="cap-road" d="M 82 75 H 359 M 220 75 V 207"/><path class="cap-road-line" d="M 82 75 H 359 M 220 75 V 207"/>${confirmed?'<path class="cap-route" d="M 220 192 V 75 H 342"/><path class="cap-route-arrow" d="m 331 65 12 10 -12 10"/>':''}<circle class="cap-origin" cx="220" cy="198" r="7"/></svg>${placeMarkup}<span class="cap-map-start">你在這裡 · 面朝上 ↑</span></div><div class="cap-map-facts" aria-label="目前已確認的資訊"><span>目的地：火車站</span>${confirmed?'<span>✓ 直走到第一個路口，再右轉</span>':''}${capHas('thanks')?'<span>✓ 已謝謝對方的幫忙</span>':''}${bus?'<span>✓ 可以搭公車</span>':''}</div>`;
}
function capstonePage(){
 const s=capstoneState,t=capstoneSteps[s.step];
 if(s.done)return `<div class="cap-shell cap-complete"><section class="cap-panel cap-dialogue"><p class="cap-role">✓ 整合練習完成</p><h1 class="cap-task">你已問清楚去火車站的方法。</h1><ul class="cap-results"><li>問出目的地，確認直走到第一個路口、右轉。</li><li>沒聽清楚時，請對方重說、指地圖。</li><li>問清楚可以搭公車，並謝謝對方的幫忙。</li></ul><p class="cap-note">再練一次，試著少看一層提示。</p><div class="cap-complete-actions">${capButton('收起提示，再練一次','data-cap-action="reset"','class="primary"')}${capButton('返回 01：先試著說','data-cap-action="return"')}</div></section><section class="cap-panel cap-board" aria-label="情境操作"><h2>這次問到的資訊</h2>${capMap(t)}<p class="cap-note">路線與位置為教學設定。</p></section></div>`;
 const student=s.role==='student',accepted=s.choice===t.correct,ready=!student&&s.heard&&accepted;
 const choices=t.mapChoices?'':`<div class="cap-objects">${t.options.map((label,i)=>capButton(`${esc(label)}${s.choice===i?(i===t.correct?' ✓':' · 再試一次'):''}`,`data-cap-choice="${i}"`,`class="cap-object${s.choice===i&&!accepted?' cap-wrong':''}" aria-pressed="${s.choice===i}" ${s.heard?'':'disabled'}`)).join('')}</div>`;
 return `<div class="cap-shell"><section class="cap-panel cap-dialogue ${student?'cap-student':'cap-other'}" aria-label="當前對話"><div class="cap-role-row"><p class="cap-role">${student?'你 · 旅客':'對方 · 路人'}</p><span class="cap-note">${s.step+1} / ${capstoneSteps.length}</span></div><h1 class="cap-task">${student?esc(t.title):'聽聽路人怎麼說'}</h1>${student?capSupport(t):capListening(t)}<div class="cap-confirm">${student?capButton('我說好了，聽路人回應 →','data-cap-action="spoken"','class="primary"'):`<label class="cap-check"><input type="checkbox" data-cap-heard ${s.heard?'checked':''}><span>${s.heard?'已聽／讀完，請點選符合回覆的物件':'我已聽完，或已讀完文字 →'}</span></label>${capButton('重新說這句','data-cap-action="repeat"','class="cap-quiet"')}`}</div><div class="cap-back">${capButton('← 上一段','data-cap-action="back"',s.step===0?'disabled':'')}${capButton('重新開始','data-cap-action="reset"')}</div></section><section class="cap-panel cap-board" aria-label="情境操作"><div class="cap-board-heading"><h2>${student?'這次要去火車站':esc(t.prompt)}</h2><span class="cap-note">示意地圖</span></div>${capMap(t)}${student?`<div class="cap-context"><p>${esc(t.context)}</p><p class="cap-note">先把題目的意思說出口，再聽路人回應。</p></div>`:`${choices}<div class="cap-feedback ${s.choice!==null&&!accepted?'cap-feedback-retry':''}" role="status">${s.choice!==null?esc(accepted?t.feedback:t.retry):s.heard?'請點選符合回覆的物件。':'先確認聽讀，再點選物件。'}</div>${capButton(s.step===capstoneSteps.length-1?'完成整合挑戰 →':'接著，說下一句 →','data-cap-action="next"',`class="primary cap-next" ${ready?'':'disabled'}`)}`}</section></div>`;
}
function capRender(focusSelector){
 render();
 const control=focusSelector?document.querySelector(focusSelector):null;
 if(control)control.focus({preventScroll:true});else focusSceneStep();
}
function capResetTurn(){
 Object.assign(capstoneState,{role:'student',heard:false,choice:null,hint:0,transcript:false,done:false});
}
document.addEventListener('click',event=>{
 const button=event.target.closest('.cap-shell button');
 if(!button||button.disabled)return;
 const d=button.dataset,s=capstoneState,t=capstoneSteps[s.step];
 if(d.capSay!==undefined){speak(d.capSay,d.capSlow==='true');return;}
 if(d.capHint!==undefined){const level=Number(d.capHint);if(![0,1,2].includes(level))return;stopAudio();s.hint=level;capRender(`[data-cap-hint="${level}"]`);return;}
 if(d.capTranscript!==undefined){s.transcript=!s.transcript;capRender('[data-cap-transcript]');return;}
 if(d.capChoice!==undefined){const value=Number(d.capChoice);if(s.done||s.role!=='other'||!s.heard||!Number.isInteger(value)||!t.options[value])return;s.choice=value;capRender(`[data-cap-choice="${value}"]`);return;}
 if(!d.capAction)return;
 stopAudio();
 if(d.capAction==='spoken'){s.role='other';s.heard=false;s.choice=null;s.transcript=false;capRender();}
 else if(d.capAction==='repeat'){capResetTurn();capRender();}
 else if(d.capAction==='reset'){resetCapstone();capRender();}
 else if(d.capAction==='back'&&s.step>0){s.step--;s.completed=s.completed.slice(0,s.step);capResetTurn();capRender();}
 else if(d.capAction==='next'&&!s.done&&s.role==='other'&&s.heard&&s.choice===t.correct){s.completed[s.step]=t.id;if(s.step===capstoneSteps.length-1){s.done=true;}else{s.step++;capResetTurn();}capRender();}
 else if(d.capAction==='return'){navigate(0);}
});
document.addEventListener('change',event=>{
 const control=event.target.closest('.cap-shell [data-cap-heard]');
 if(!control||capstoneState.role!=='other')return;
 capstoneState.heard=control.checked;capstoneState.choice=null;capRender('[data-cap-heard]');
});

function guidedHint(words,answer,answerZh='',id='auto-'+dgHintIndex++){

 return `<div class="dg-hint" data-hint-key="${esc(key)}"><div class="dg-hint-tabs" role="group" aria-label="提示程度">${['自己說','關鍵字','看整句'].map((label,i)=>btn(label,`data-guide-hint="${esc(key)}" data-level="${i}"`,`aria-pressed="${level===i}"`)).join('')}</div><div class="dg-hint-stage">${panes.map((pane,i)=>`<div class="dg-hint-pane" data-pane="${i}" aria-hidden="${level!==i}" ${level===i?'':'inert'}>${pane}</div>`).join('')}</div></div>`;
}
hint=function(words,answer,answerZh){return guidedHint(words,answer,answerZh)};

 let point=[210,315,'起點'];
 f.steps.forEach((t,i)=>{if(t.valid.includes(values[i])&&t.position)point=t.position;});
 const [x,y,label]=point,draw=y!==315,plotY=y===90?72:y===215?146:215;

 return `<div class="scene-state dg-map-state"><div class="dg-map" data-map-mode="${stationRight?'station':'post'}" role="img" aria-label="教學示意地圖：面朝上，${stationRight?'火車站在右前方，郵局在左前方':'火車站在左前方，郵局在右前方'}，公車站在左側。${esc(label)}。"><svg class="dg-map-roads" viewBox="0 0 420 250" preserveAspectRatio="none" aria-hidden="true"><rect class="dg-map-block" x="22" y="106" width="140" height="64" rx="16"/><rect class="dg-map-block" x="258" y="106" width="140" height="64" rx="16"/><path class="dg-road" d="M 85 72 H 335 M 210 72 V 215"/><path class="dg-road-line" d="M 85 72 H 335 M 210 72 V 215"/>${draw?`<polyline class="dg-route" points="210,215 210,${plotY} ${x},${plotY}"/>`:''}<circle class="dg-route-pin" cx="${x}" cy="${plotY}" r="7"/></svg><div class="dg-map-place dg-map-station"><span aria-hidden="true">▥</span>火車站</div><div class="dg-map-place dg-map-post"><span aria-hidden="true">✉</span>郵局</div><div class="dg-map-place dg-map-bus"><span aria-hidden="true">▤</span>公車站</div><div class="dg-map-origin">起點 · 面朝上 ↑</div></div><p class="dg-map-status">${draw||values.some(Number.isInteger)?'✓ '+esc(label):'目的地：'+destination}${done?' · 流程完成':''}</p></div>`;
}
lessonScene=function(f,values,done){return dgMap(f,values,done)};

// A begins with listening and pointing before the three taught learner lines.
let dgPrelude={done:false,heard:false,choice:null};
function dgResetPrelude(){dgPrelude={done:false,heard:false,choice:null};}
function dgPreludePage(f){

 return `<div class="dg-grid scene-grid task-scene"><section class="panel dg-panel dg-speaker dg-listener"><p class="dg-role">對方 · 路人先問</p><h1 class="dg-task">先聽懂，指出你想去的地方</h1>${dgListening(p)}${check('data-dg-prelude-heard','我已聽完，或已讀完文字',s.heard)}<p>${esc(p.task)}</p></section><section class="panel dg-panel scene-board"><h2>你想去火車站</h2>${dgMap(f,[],false)}<div class="objects">${p.objects.map(([,label],i)=>btn(esc(label),`data-dg-prelude-choice="${i}"`,`class="object" aria-pressed="${s.choice===i}" ${s.heard?'':'disabled'}`)).join('')}</div><p class="dg-feedback" role="status">${s.choice===null?'先聽讀，再指出目的地。':correct?'✓ 已指出火車站。接著用本任務教過的句子問路、確認方向，最後道謝。':'這次想去火車站；請再指出一次。'}</p>${btn('已指出目的地，開始問路 →','data-dg-prelude-next',`class="primary" ${s.heard&&correct?'':'disabled'}`)}</section></div>`;
}

function dgListening(t){
 return `<div class="dg-listening"><div class="dg-listen-actions">${btn('▶ 播放',`data-say="${esc(t.line)}"`,'aria-label="播放路人回應"')}${btn('慢速',`data-say="${esc(t.line)}" data-slow="true"`)}${btn(dgTranscript?'收起文字':'看文字','data-dg-transcript',`aria-pressed="${dgTranscript}"`)}</div><div class="dg-hint-stage dg-transcript"><div class="dg-hint-pane" aria-hidden="${dgTranscript}" ${dgTranscript?'inert':''}><p class="dg-hint-empty">先聽一句，聽懂意思就好。<br>需要時可以看文字。</p></div><div class="dg-hint-pane" aria-hidden="${!dgTranscript}" ${dgTranscript?'':'inert'}><p class="dg-en en" lang="en">${esc(t.line)}</p><p class="flow-translation">${esc(t.zh)}</p></div></div></div>`;
}
scenePage=function(){
 const f=flows[flow],t=currentStep();
 if(f.prelude&&turn===0&&!finished&&!dgPrelude.done)return dgPreludePage(f);
 if(finished)return `<div class="dg-grid dg-completion"><section class="panel dg-panel"><p class="dg-role">✓ 本輪流程完成</p><h1 class="dg-task">${esc(f.summary)}</h1><div class="dg-completed-lines">${f.steps.map(t=>`<p class="dg-en" lang="en">${esc(t.answer)}</p>`).join('')}</div><p>再練同一段，試著少看一層提示。</p><div class="actions">${btn('收起提示再練一次',`data-start="${focusRound}"`)}${btn('只換一個條件 →','data-page="3"','class="primary"')}</div><p class="fine">完成標記會保留；是否熟悉，仍由師生在第六部分確認。</p></section><section class="panel dg-panel"><h2>這次的路線</h2>${sceneState()}</section></div>`;
 const student=t.askFirst?!spoken:heard,role=student?'你 · 旅客':`對方 · ${course.replyRole}`;

 return `<div class="dg-grid scene-grid task-scene"><section class="panel dg-panel dg-speaker ${student?'':'dg-listener'}" aria-label="當前對話"><div class="dg-role-row"><p class="dg-role">${esc(role)}</p><span class="fine">對話 ${turn+1} / ${f.steps.length}</span></div><h1 class="dg-task">${student?esc(t.task):'聽聽路人怎麼說'}</h1>${student?guidedHint(t.words,t.answer,t.answerZh,'flow-'+f.id+'-'+turn):dgListening(t)}<div class="dg-turn-confirm">${student?check('id="spoken"','我說好了，聽路人回應 →',spoken):check('id="heard"',heard?'已聽／讀完，接著點選':'我已聽完，或已讀完文字 →',heard)}${!student&&t.askFirst?`<div class="dg-repeat-confirm">${check('id="spoken"','已開口（取消可重說）',spoken)}</div>`:''}</div><div class="dg-flow-back">${btn('← 上一段','data-act="back"',turn===0?'disabled':'')}${btn('重新開始本輪',`data-start="${focusRound}"`,'class="dg-quiet"')}</div></section><section class="panel dg-panel scene-board" aria-label="情境操作"><div class="dg-role-row"><h2>${confirmed?'點選符合回覆的物件':student?'看情境，先開口':'聽懂後，在這裡點選'}</h2><span class="fine">示意地圖</span></div>${sceneState()}${student?`<div class="dg-scene-context"><p>${esc(f.context)}</p><p class="fine">先把題目的意思說出口，再聽路人回應。</p></div>`:`<div class="objects">${t.objects.map(([,label],i)=>btn(`<span class="dg-object-label">${esc(label)}${choice===i?(accepted(t,i)?' ✓':' · 再試一次'):''}</span>`,`data-choice="${i}"`,`class="object ${choice===i&&!accepted(t,i)?'dg-choice-wrong':''}" aria-pressed="${choice===i}" ${confirmed?'':'disabled'}`)).join('')}</div><div id="flowFeedback" class="dg-feedback" role="status">${feedback?`<p class="feedback ${accepted(t,choice)?'':'retry'}">${esc(feedback)}</p>`:`<p class="fine">${confirmed?'選一個符合剛才回覆的選項。':'先確認聽讀，再選擇物件。'}</p>`}</div><div class="dg-flow-actions">${btn(turn===f.steps.length-1?'完成這段對話 →':'接著，說下一句 →','data-act="next"',`class="primary" ${canNext()?'':'disabled'}`)}</div>`}</section></div>`;
};

// Preserve the original data-driven footer and its early-close action, with a single primary next step.
const dgOriginalFooter=focusFooter;
focusFooter=function(){
 if(page===7)return '';
 if(page===0)return `<div class="footer-actions">${btn('前進：學這個任務的句子 →','data-page="1"','class="primary"')}</div>`;
 const wrapper=document.createElement('div');wrapper.innerHTML=dgOriginalFooter();
 // A former mixed-review preference never changes the current round's footer.
 if(page===5)wrapper.querySelector('.footer-actions > button:last-child').textContent=`只練任務 ${currentRound().id} 的回家挑戰 →`;
 wrapper.querySelector('.footer-actions > button:last-child')?.classList.add('primary');
 // Part 3 already has its own visible next step. The next section appears on completion.
 if(page===2&&!finished)wrapper.querySelector('.footer-actions > button:last-child')?.remove();
 if(page===2&&finished)wrapper.querySelector('.footer-actions > button:last-child')?.classList.remove('primary');
 return wrapper.innerHTML;
};
render=function(){
 const scope=[focusRound,page,mode,reply,mission,pair,flow,turn,finished,spoken,page===7?capstoneContext():''].join(':');
 if(scope!==dgScope){dgResetSupport();dgScope=scope;}dgHintIndex=0;
 const views=[intro,phrasePage,scenePage,missionPage,pairPage,progressPage,homePage,capstonePage];
 $('#main').innerHTML=views[page]()+focusFooter();$('#main').classList.toggle('lesson-phrase-page',page===1);
 // Keep the first lesson action beside the first attempt, before optional overviews.
 if(page===0){const first=$('#main .before-panel'),footer=$('#main > .footer-actions');if(first&&footer)first.after(footer);}
 $('#nav').innerHTML=dgCourseMenu();
 $('#dg-context').innerHTML=`<div class="dg-context-copy"><span class="dg-current-section">${String(page+1).padStart(2,'0')} · ${dgLabels[page]}</span><span class="dg-current-round">${page===7?'自己完成一趟問路':`${esc(currentRound().id)} · ${esc(currentRound().name)}`}</span></div>${dgTaskSwitch()}`;
 showStorage();
};
navigate=function(p){
 if(!Number.isInteger(p)||p<0||p>=dgLabels.length)return;
 if(p===7&&page!==7)resetCapstone();
 stopAudio();dgResetSupport();page=p;$('#dg-day-picker').open=false;$('#dg-course-dialog').close();render();focusMain();
 const top=$('#dg-context').getBoundingClientRect().top+scrollY-($('.top').getBoundingClientRect().height||0);
 window.scrollTo({top:Math.max(0,top),behavior:'instant'});
};

 #travel-app-views iframe[data-active]{visibility:visible;pointer-events:auto}
 #travel-app-status{position:fixed;z-index:3000;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);max-height:calc(100dvh - 40px);overflow:auto;padding:12px 16px;border:1px solid var(--line,#d9c4ac);border-radius:16px;background:var(--panel,#fff7ed);color:var(--ink,#382c22);box-shadow:0 4px 20px #0002;font:16px/1.5 system-ui}
 #travel-app-status[hidden]{display:none}
 #travel-app-status button,#travel-app-status a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin:4px;padding:8px 14px;border:1px solid currentColor;border-radius:10px;background:transparent;color:inherit;font:inherit;cursor:pointer}
 #travel-app-status p{margin:0 0 4px}
 `;
 document.head.append(style);
 for(const child of document.body.children)child.setAttribute('data-travel-original','');
 const host=document.createElement('div');host.id='travel-app-views';document.body.append(host);
 const status=document.createElement('div');status.id='travel-app-status';status.hidden=true;
 const message=document.createElement('p');message.role='status';message.setAttribute('aria-live','polite');status.append(message);
 const retry=document.createElement('button');retry.type='button';retry.textContent='重試';
 const direct=document.createElement('a');direct.textContent='直接開啟';
 const cancel=document.createElement('button');cancel.type='button';cancel.textContent='留在這一課';
 status.append(retry,direct,cancel);document.body.append(status);
 const initial={url:ownURL,win:window,title:document.title,scroll:0,used:0};
 const views=new Map([[ownURL,initial]]),sources=new Map(),requests=new Map();
 let current=initial,serial=0,tick=0,statusTimer,idleTimer,pending=null;
 let preference={theme:document.documentElement.dataset.theme,size:document.documentElement.dataset.size};
 window.history.scrollRestoration='manual';
 const initialAddress=location.href;
 window.history.replaceState({travelApp:true},'',initialAddress);
 function showStatus(text,failed=false){
  message.textContent=text;retry.hidden=direct.hidden=!failed;status.hidden=false;
 }
 function clearStatus(){clearTimeout(statusTimer);status.hidden=true;}
 function stop(view){view.win.stopAudio?.();}
 function applyAppearance(view){
  view.win.dispatchEvent(new view.win.CustomEvent('travel-appearance-apply',{detail:preference}));
 }
 function appearance(win){
  preference={theme:win.document.documentElement.dataset.theme,size:win.document.documentElement.dataset.size};
  for(const view of views.values())if(view.win!==win)applyAppearance(view);
 }
 function prefetch(url){
  if(views.has(url)||sources.has(url))return Promise.resolve(sources.get(url));
  if(requests.has(url))return requests.get(url);
  const abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),15000);
  const request=fetch(url,{signal:abort.signal,credentials:'same-origin'}).then(async response=>{
   if(!response.ok||!response.headers.get('content-type')?.includes('text/html'))throw Error('Lesson unavailable');
   const html=await response.text();
   if(!html.includes('id="travel-app-navigation"'))throw Error('Lesson version unavailable');
   sources.set(url,html);
   while(sources.size>5)sources.delete(sources.keys().next().value);
   return html;
  }).finally(()=>{clearTimeout(timeout);requests.delete(url);});
  requests.set(url,request);
  // Speculative requests must never produce an unhandled rejection.
  request.catch(()=>{});return request;
 }
 function scheduleNext(){
  clearTimeout(idleTimer);
  if(navigator.connection?.saveData)return;
  idleTimer=setTimeout(()=>{
   const doc=current.win.document,links=[...doc.querySelectorAll('.day-switcher a[href]')];
   const index=links.findIndex(a=>route(a.href)===current.url);
   const next=links[index+1]||doc.querySelector('main a[href*="travel-"]');
   if(next){const url=route(next.href);if(url&&url!==current.url)prefetch(url);}
  },1000);
 }
 async function prepare(url,token){
  if(views.has(url))return views.get(url);
  const html=await prefetch(url);
  if(token!==serial)return null;
  const parsed=new DOMParser().parseFromString(html,'text/html');
  if(!parsed.querySelector('main'))throw Error('Lesson incomplete');
  const baseTag=document.createElement('base');baseTag.href=url;baseTag.target='_top';
  parsed.head.prepend(baseTag);
  const frame=document.createElement('iframe');frame.setAttribute('data-travel-view','');
  frame.title=parsed.title;frame.setAttribute('aria-hidden','true');frame.tabIndex=-1;
  // No iframe URL navigation: fetched documents are committed only when ready.
  const view={url,title:parsed.title,frame,win:null,scroll:0,used:++tick};
  await new Promise((resolve,reject)=>{
   const timeout=setTimeout(()=>{frame.remove();reject(Error('Lesson preparation timed out'));},15000);
   frame.onload=()=>{
    if(!frame.contentDocument?.querySelector('#travel-app-navigation'))return;
    clearTimeout(timeout);frame.onload=null;
    if(!frame.contentDocument.querySelector('main')?.children.length){frame.remove();reject(Error('Lesson did not render'));return;}
    view.win=frame.contentWindow;resolve();
   };
   frame.srcdoc='<!doctype html>'+parsed.documentElement.outerHTML;host.append(frame);
  });
  if(token!==serial){frame.remove();return null;}
  views.set(url,view);return view;
 }
 function prune(){
  // Keep the initial document plus the two most recently used lesson frames.
  for(const view of [...views.values()].filter(v=>v!==initial&&v!==current).sort((a,b)=>a.used-b.used)){
   if(views.size<=3)break;
   view.frame.remove();views.delete(view.url);
  }
 }
 function commit(view,{pop=false,hash=''}={}){
  current.scroll=current.win.scrollY;
  stop(current);
  current.win.document.querySelectorAll('dialog[open]').forEach(dialog=>dialog.close());
  if(current.frame){current.frame.removeAttribute('data-active');current.frame.setAttribute('aria-hidden','true');current.frame.tabIndex=-1;}
  current=view;current.used=++tick;applyAppearance(view);
  document.documentElement.classList.toggle('travel-app-framed',view!==initial);
  if(view.frame){view.frame.setAttribute('data-active','');view.frame.removeAttribute('aria-hidden');view.frame.removeAttribute('tabindex');}
  document.title=view.title;
  if(!pop)window.history.pushState({travelApp:true},'',view.url+hash);
  view.win.scrollTo({top:view.scroll,behavior:'instant'});
  const main=view.win.document.querySelector('main');
  if(main){main.setAttribute('tabindex','-1');main.focus({preventScroll:true});}
  if(hash){try{view.win.document.getElementById(decodeURIComponent(hash.slice(1)))?.scrollIntoView();}catch{}}
  prune();scheduleNext();
 }
 async function open(url,options={}){
  url=route(url);if(!url)return;
  const token=++serial;clearStatus();clearTimeout(idleTimer);pending={url,options};
  if(url===current.url){pending=null;scheduleNext();return;}
  stop(current);
  retry.onclick=()=>open(url,options);
  direct.href=url;direct.target='_top';
  statusTimer=setTimeout(()=>showStatus('正在準備課程，原課程仍可操作。'),650);
  try{
   const view=await prepare(url,token);
   if(token!==serial||!view)return;
   clearStatus();pending=null;commit(view,options);
  }catch(error){
   if(token!==serial)return;
   clearStatus();
   if(options.pop)window.history.replaceState({travelApp:true},'',current.url);
   // Retrying after a failed Back action must restore a matching URL as well.
   retry.onclick=()=>open(url,{hash:options.hash});
   showStatus('暫時無法開啟這一課。你的原課程和作答仍保留，可以重試。',true);
  }
 }
 cancel.onclick=()=>{
  ++serial;clearStatus();
  if(pending?.options.pop)window.history.replaceState({travelApp:true},'',current.url);
  pending=null;scheduleNext();
 };
 window.travelApp={open,prefetch,appearance};
 wire(window.travelApp);
 window.addEventListener('popstate',()=>{
  const url=route(location.href);
  if(url)open(url,{pop:true,hash:location.hash});
 });
 window.addEventListener('pagehide',()=>stop(current));
 scheduleNext();
})();
