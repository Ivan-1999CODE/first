<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const places=[{id:'station',en:'Station',zh:'車站',x:100,y:90,path:'300,390 300,90 100,90',route:'Go straight to the second intersection. Turn left. The station is at the end of the road.',listen:'Go straight to the second intersection. Turn left. It is at the end of the road.'},{id:'hotel',en:'Hotel',zh:'飯店',x:500,y:90,path:'300,390 300,90 500,90',route:'Go straight to the second intersection. Turn right. The hotel is at the end of the road.',listen:'Go straight to the second intersection. Turn right. It is at the end of the road.'},{id:'cafe',en:'Café',zh:'咖啡店',x:100,y:240,path:'300,390 300,240 100,240',route:'Go straight to the first intersection. Turn left. The café is at the end of the road.',listen:'Go straight to the first intersection. Turn left. It is at the end of the road.'},{id:'pharmacy',en:'Pharmacy',zh:'藥局',x:500,y:240,path:'300,390 300,240 500,240',route:'Go straight to the first intersection. Turn right. The pharmacy is at the end of the road.',listen:'Go straight to the first intersection. Turn right. It is at the end of the road.'}];
const phrases=[['開口問位置','Excuse me. Where is the station?','不好意思，請問車站在哪裡？'],['說明需要','I need a taxi.','我需要一輛計程車。'],['問能不能走路','Can I walk there?','我可以走路到那裡嗎？'],['請對方重說','Sorry, could you say that again?','不好意思，可以再說一次嗎？'],['請對方指給你看','Can you show me on the map?','可以在地圖上指給我看嗎？'],['結束對話','Thank you for your help.','謝謝你的幫忙。']];
const situations=[{name:'回飯店｜走累了',prompt:'你想回飯店，但走累了，想搭計程車。',goals:['說出你想去的地方','補充你需要的交通方式','問在哪裡可以搭車'],words:'hotel · tired · taxi',starter:'I want to… / I need… / Where…?',example:'I want to go to my hotel. I’m tired. Where can I get a taxi?',reply:'There is a taxi stand next to the station.',follow:'你不知道車站在哪裡。接著問什麼？',followEx:'Where is the station?'},{name:'去車站｜想走路',prompt:'你想去車站。你想先確認能不能走路到那裡。',goals:['讓對方知道你要找車站','詢問能不能走路去','根據對方回答再問一句'],words:'station · walk · bus',starter:'Where is…? / Can I…?',example:'Excuse me. Where is the station? Can I walk there?',reply:'It is about thirty minutes on foot.',follow:'你只剩 10 分鐘，不想走路了。接著問什麼？',followEx:'Is there a bus? / Where can I get a taxi?'},{name:'找咖啡店｜等朋友',prompt:'你想找咖啡店等朋友，而且希望能在那裡坐下。',goals:['說出你要找的地方','問能不能坐在那裡','回應店員提供的資訊'],words:'café · sit · friend',starter:'I’m looking for… / Can I…?',example:'I’m looking for a café. Can I sit there?',reply:'Yes, but we close in ten minutes.',follow:'只剩 10 分鐘了。你想找另一家，接著問什麼？',followEx:'Is there another café nearby?'}];

try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&typeof raw==='object'){for(const k of ['before','after','homeAnswer'])if(typeof raw[k]==='string')state[k]=raw[k];for(const k of ['drafts','followups'])if(Array.isArray(raw[k]))state[k]=state[k].map((_,i)=>typeof raw[k][i]==='string'?raw[k][i]:'');if(Array.isArray(raw.ratings))state.ratings=state.ratings.map((_,i)=>[-1,0,1,2].includes(raw.ratings[i])?raw.ratings[i]:-1);if(Array.isArray(raw.home))state.home=state.home.map((_,i)=>raw.home[i]===true);}}catch(e){$('#storageNotice').classList.remove('hidden');}
let page=0,situation=0,hintLevel=0,showReply=false,followHint=false,pairIndex=0,role='A',pairHelp=false,pairEvent=false,listenIndex=2,listenText=false,listenFeedback='',listenCorrect=false,homeListenCorrect=false,homeListenText=false,homeFeedback='';

function speak(text,rate=.82){if(!('speechSynthesis'in window)){toast('此瀏覽器無法朗讀。請打開英文文字，由老師示範或自行練習。');return;}speechSynthesis.cancel();speech=new SpeechSynthesisUtterance(text);speech.lang='en-US';speech.rate=rate;const voices=speechSynthesis.getVoices();const voice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(voice)speech.voice=voice;speech.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))toast('朗讀未能播放。請打開英文文字，或確認裝置的語音設定。');};speechSynthesis.speak(speech);}

$('#nav').innerHTML=steps.map((s,i)=>'<button data-page="'+i+'" '+(i===page?'aria-current="step"':'')+'><span class="stepnum">0'+(i+1)+'</span>'+s+'</button>').join('');
let html='';
if(page===0)html=`<div class="grid"><section class="card"><p class="eyebrow">Your first try</p><div class="chips"><span class="chip">情境：陌生城市</span><span class="chip">目標：找到車站</span></div><p class="scenario">你想去<strong>車站</strong>，<br>也想知道能不能<strong>走路到那裡</strong>。</p><p>你遇到一位路人。你會怎麼開口？</p><div class="note">先想 20 秒，再說給同學聽。不知道完整句子也沒關係。</div></section><section class="card">${field('before','記下你第一次會說的英文',state.before,'直接寫你現在會說的話，不必先修正。')}<p class="tiny muted">可以自己輸入，或由老師記錄你剛才說的話。輸入後自動儲存。</p><div class="actions"><button class="primary" data-act="save-first">保留這次嘗試</button><button data-page="1">帶上幾句英文 →</button></div></section></div>${teacher('這是課前紀錄，不評分、不先教答案。先讓每位學生開口，再保留原句；共用投影可記錄一位示範者，其餘學生用手機或紙本記錄。第一堂建議：本頁 5 分鐘、句子 10 分鐘、地圖 10 分鐘、雙人 15 分鐘、重試 10 分鐘。')}`;
if(page===1)html=`<div class="phrase-grid">${phrases.map((p,i)=>`<article class="phrase"><small>0${i+1} / ${p[0]}</small><p class="en">${p[1]}</p><div class="actions"><button data-phrase="${i}">▶ 聽一句</button><button data-meaning="${i}" aria-expanded="false">看中文</button></div><p id="meaning${i}" class="meaning hidden">${p[2]}</p></article>`).join('')}</div><section class="card separate"><h2>聽方向時，先抓住這些詞</h2><div class="actions">${[['Go straight.','↑ 直走'],['Turn left.','← 左轉'],['Turn right.','→ 右轉'],['The first intersection.','第 1 個路口'],['The second intersection.','第 2 個路口']].map(p=>'<button data-say="'+p[0]+'">'+p[1]+' <span class="en">'+p[0]+'</span></button>').join('')}</div><p class="note">第一輪選 2～3 句就好。先問位置，再加一句自己的需要。</p></section>${teacher('先確認意思，再示範自然語氣。不要一次要求背完。學生能用 “Where is…?” 成功問到位置後，才延伸較長的禮貌問法。朗讀使用裝置語音，音色與可用性依瀏覽器而異。')}`;
if(page===2)html=`<div class="grid"><section class="card"><p class="eyebrow">Listen & find</p><h2>路人指的是哪裡？</h2><p>從起點向前走，聽路口和左右方向。點選地圖上的目的地。</p><div class="actions"><button class="primary" data-act="listen">▶ 播放路線</button><button data-act="listen-slow">慢一點</button><button data-act="listen-text" aria-expanded="${listenText}">${listenText?'收起文字':'看英文文字'}</button></div>${listenText?'<p class="hint en big-en">'+places[listenIndex].listen+'</p>':''}<div class="feedback ${listenFeedback&&!listenCorrect?'retry':''}" role="status">${listenFeedback}</div><div class="actions separate"><button data-act="listen-next">換一條路線 →</button></div><div class="note">先用耳朵找路。需要時才看文字；答錯可以重新聽，不扣分。</div></section><section aria-label="選擇目的地">${map(listenCorrect?places[listenIndex].id:'',true)}</section></div>${teacher('請學生用手指出路線，再選地點。不要只問答案是哪一個；追問「在哪個路口轉彎？」。需要降低難度時，先練第一個路口的咖啡店與藥局。')}`;
if(page===3){const s=situations[situation];html=`<div class="grid"><section class="card"><label class="field" for="situation">選擇這次的情境</label><select id="situation">${situations.map((s,i)=>'<option value="'+i+'" '+(i===situation?'selected':'')+'>'+s.name+'</option>').join('')}</select><p class="scenario">${s.prompt}</p><h3>先想：你要讓對方知道什麼？</h3>${s.goals.map((g,i)=>'<p><span class="number-disc">'+(i+1)+'</span>'+g+'</p>').join('')}<div class="actions"><button data-act="hint" ${hintLevel>=3?'disabled':''}>${hintLevel===0?'給我一點提示':hintLevel===1?'再看句子開頭':hintLevel===2?'看一種參考說法':'提示已全部展開'}</button>${hintLevel?'<button data-act="hide-hint">收起提示</button>':''}</div>${hintLevel>=1?'<div class="hint"><span class="tiny muted">關鍵詞</span><div class="en">'+s.words+'</div></div>':''}${hintLevel>=2?'<div class="hint"><span class="tiny muted">可以這樣開頭</span><div class="en">'+s.starter+'</div></div>':''}${hintLevel>=3?'<div class="hint"><span class="tiny muted">其中一種說法，不是唯一答案</span><p class="en">'+s.example+'</p><button data-say="'+esc(s.example)+'">▶ 聽參考說法</button></div>':''}</section><section class="card">${field('draft','我的說法',state.drafts[situation],'先說給同學聽，再記下自己的英文。')}<p class="tiny muted">不用和範例一樣。可以分成幾句短句。</p><button class="primary" data-act="reply">聽聽對方怎麼回應 →</button>${showReply?'<div class="hint"><span class="tiny muted">對方回答</span><p class="en big-en">'+s.reply+'</p><button data-say="'+esc(s.reply)+'">▶ 再聽一次</button></div><p><strong>'+s.follow+'</strong></p>'+field('followup','我接著說',state.followups[situation],'這一次，根據回答再問一句。')+'<button data-act="follow-hint">'+(followHint?'收起參考':'需要一句參考')+'</button>'+(followHint?'<p class="hint en">'+s.followEx+'</p>':''):''}<div class="note">同學回饋：我聽懂你要什麼嗎？還缺哪個資訊？<br>這裡不自動判斷文法，由老師或同學一起確認。</div></section></div>${teacher('先讓學生用已知的字說出意思，再修一個最有幫助的地方。對方回覆為預設情境，不是 AI 對學生句子的判讀；老師可以口頭替換回覆。收起提示後重說一次，比直接抄下修正版更能檢查是否會用。')}`;}
if(page===4){const p=places[pairIndex];html=`<div class="actions" style="margin-bottom:18px"><span class="tag">任務 ${pairIndex+1} / 4</span><button data-act="pair-next">換一個目的地</button><span class="tiny muted">同一台裝置：先讓對方轉身，再切換角色。</span></div><div class="role-tabs"><button data-role="A" aria-pressed="${role==='A'}">A｜我是旅客</button><button data-role="B" aria-pressed="${role==='B'}">B｜我來幫忙</button></div>${role==='A'?`<div class="grid"><section class="card navy"><div class="role-letter">A</div><p class="eyebrow" style="color:#8ae6cf">Your mission</p><h2>找到 ${p.en} · ${p.zh}</h2><p class="scenario">你的手機沒有網路。<br>問出路線，再確認一次。</p><p class="muted">問完後，用手指出你會往哪裡走。協助者再打開地圖確認。</p></section><section class="card"><h2>你來決定怎麼問</h2><p>① 先禮貌開口，說出目的地。</p><p>② 聽路線；沒聽懂就請對方重說。</p><p>③ 用一句話確認方向或請對方指圖。</p><button data-act="pair-help">${pairHelp?'收起提示':'需要時才打開提示'}</button>${pairHelp?'<p class="hint en big-en">Excuse me. Where is the '+p.en.toLowerCase()+'?<br>Could you say that again?<br>Can you show me on the map?</p>':''}<div class="note">完成後交換角色，換一個目的地再試。</div></section></div>`:`<div class="grid"><section class="card"><p class="eyebrow">Role B · 協助者</p><h2>先聽對方問，再提供資訊。</h2><p class="en big-en">${p.route}</p><div class="actions"><button data-say="${esc(p.route)}">▶ 聽示範</button><button data-act="pair-event">${pairEvent?'收起變化':'加一個變化'}</button></div>${pairEvent?'<div class="hint"><strong>旅客問能不能走路時，回答：</strong><p class="en big-en">It’s a thirty-minute walk.</p><p>等旅客決定是否改搭車。若他詢問計程車，回答：</p><p class="en">You can get a taxi here.</p><p class="tiny muted">這是對話變化，示意圖不標示距離。</p></div>':''}<div class="note">給旅客思考的時間。若對方請你重說，就分成更短的句子。</div></section>${map(p.id)}</div>`}${teacher('先用 A 卡投影，由老師當 B；熟悉後改雙人。角色切換不是保密系統：單一螢幕請輪流查看。第二輪請學生少看提示。任務成功的判準是「問到路、確認路線、需要時會求助」，不是背出原句。')}`;}
if(page===5)html=`<section class="card tinted"><p class="eyebrow">One more try</p><h2>新情境：你想去飯店，也想知道能不能走路到那裡。</h2><p>先不看提示，和同學完成一次對話。請同學回答：<span class="en">“It’s a thirty-minute walk.”</span> 試著再接一句。</p>${field('after','這次我會說',state.after,'先自己完成，再往下比較第一次的答案。')}</section><div class="grid equal separate"><section class="card"><p class="eyebrow">Before · 找車站</p><h2>第一次的我</h2><div class="compare-text en" id="beforeCompare">${esc(state.before)||'還沒有課前紀錄，可以回第 1 步補上。'}</div></section><section class="card"><p class="eyebrow">After · 找飯店</p><h2>現在的我</h2><div class="compare-text en" id="afterCompare">${esc(state.after)||'完成上面的新情境後，這裡會顯示你的答案。'}</div></section></div><section class="card separate"><h2>我現在能做到哪一步？</h2><p class="muted">這是自我檢核，請老師或同學幫你確認；不是自動評分。</p><div class="rating">${['主動開口問位置','補充自己的需求','根據對方回答再問一句','聽不懂時請對方幫忙'].map((label,i)=>'<div class="rating-row"><strong>'+label+'</strong><div class="actions">'+['看範例完成','看關鍵詞完成','獨立完成'].map((r,j)=>'<button data-rating="'+i+','+j+'" aria-pressed="'+(state.ratings[i]===j)+'">'+r+'</button>').join('')+'</div></div>').join('')}</div><div class="actions separate"><button class="primary" data-act="export">匯出我的學習紀錄</button><button data-page="6">去課後練習 →</button></div></section>${teacher('前後情境的核心需求相同，目的地不同。先比較「問位置、問步行」兩項，再把追問列為新增能力；不要因句子較長就直接判定進步。下堂課換情境再測一次，確認是否保留。')}`;
if(page===6)html=`<section class="card" style="margin-bottom:20px"><div class="heading" style="margin:0"><div><p class="eyebrow">8–10 minutes</p><h2 style="margin:0">今天的 3 個小練習</h2></div><span class="tag" id="homeCount">${state.home.filter(Boolean).length} / 3 已練習</span></div><div class="progress-track"><div id="homeBar" style="width:${state.home.filter(Boolean).length/3*100}%"></div></div><p class="tiny muted" style="margin:10px 0 0">完成記號由你勾選，代表練習過，不代表能力測驗通過。</p></section><div class="grid"><section class="card"><p class="eyebrow">01 · Listen</p><h2>聽完，選出目的地。</h2><div class="actions"><button class="primary" data-act="home-listen">▶ 聽路線</button><button data-act="home-text">${homeListenText?'收起文字':'需要英文文字'}</button></div>${homeListenText?'<p class="hint en">'+places[3].listen+'</p>':''}${map(homeListenCorrect?'pharmacy':'',true)}<div id="homeFeedback" class="feedback ${homeFeedback&&!homeListenCorrect?'retry':''}" role="status">${homeFeedback}</div><div class="checklist"><label><input type="checkbox" data-home="0" ${state.home[0]?'checked':''}>我已聽過並完成找路練習</label></div></section><div class="stack"><section class="card"><p class="eyebrow">02 · Speak</p><h2>自己說一次，再看參考。</h2><p>你在找車站，但沒聽清楚對方的回答。試著說出問位置和請對方重說的句子。</p><details><summary>我說完了，看一種參考說法</summary><p class="hint en big-en">Excuse me. Where is the station?<br>Sorry, could you say that again?</p><button data-say="Excuse me. Where is the station? Sorry, could you say that again?">▶ 聽參考</button></details><div class="checklist"><label><input type="checkbox" data-home="1" ${state.home[1]?'checked':''}>我收起參考後，又自己說了一次</label></div></section><section class="card"><p class="eyebrow">03 · Make it yours</p><h2>換成你真的想去的地方。</h2>${field('homeAnswer','我要去哪裡？我還想問什麼？',state.homeAnswer,'例如：你想去某間飯店，也想問哪裡可以搭車。請試著寫英文。')}<div class="checklist"><label><input type="checkbox" data-home="2" ${state.home[2]?'checked':''}>我已大聲說出自己的句子</label></div><p class="tiny muted">把這段帶到下次上課，請老師幫你修改最重要的一點。</p></section></div></div><div class="note">明天再打開這頁，先不看參考說一次。需要保存個人紀錄時，請按右上角「匯出我的練習」。</div>`;
$('#main').innerHTML='<div class="heading"><div><p class="eyebrow">UNIT 01 / STEP 0'+(page+1)+'</p><h1>'+titles[page]+'</h1><p class="sub">'+subs[page]+'</p></div><span class="tag">'+(page===6?'課後自主練習':'老師帶領 · 課堂練習')+'</span></div>'+html+'<div class="footer-nav"><button data-page="'+(page-1)+'" '+(page===0?'disabled':'')+'>← 上一步</button><button class="dark" data-page="'+(page+1)+'" '+(page===6?'disabled':'')+'>'+(page===5?'課後再練一次':'下一步')+' →</button></div><p class="bottom-note">TRAVEL LAB · 先傳達意思，再讓表達更清楚。所有作答只保存在本機瀏覽器。</p>';
}
function exportWork(){const rows=['TRAVEL LAB｜問路與求助・我的練習紀錄','','【課前：找車站】',state.before||'尚未作答','','【課後：找飯店】',state.after||'尚未作答','','【我的情境練習】'];situations.forEach((s,i)=>rows.push(s.name,state.drafts[i]||'尚未作答','追問：'+(state.followups[i]||'尚未作答'),''));rows.push('【能力自我檢核】');['問位置','補充需求','追問','請求協助'].forEach((r,i)=>rows.push(r+'：'+(['看範例完成','看關鍵詞完成','獨立完成'][state.ratings[i]]||'未評估')));rows.push('','【課後：我的旅行】',state.homeAnswer||'尚未作答','已勾選練習：'+state.home.filter(Boolean).length+'/3');const blob=new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='我的旅遊英文練習.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('已匯出練習紀錄。');}
document.addEventListener('input',e=>{const id=e.target.id;if(['before','after','homeAnswer'].includes(id)){state[id]=e.target.value;if(id==='after'&&$('#afterCompare'))$('#afterCompare').textContent=state.after||'完成上面的新情境後，這裡會顯示你的答案。';save();}if(id==='draft'){state.drafts[situation]=e.target.value;save();}if(id==='followup'){state.followups[situation]=e.target.value;save();}});
document.addEventListener('change',e=>{if(e.target.id==='situation'){situation=Number(e.target.value);hintLevel=0;showReply=false;followHint=false;render();}if(e.target.matches('[data-home]')){state.home[Number(e.target.dataset.home)]=e.target.checked;save();$('#homeCount').textContent=state.home.filter(Boolean).length+' / 3 已練習';$('#homeBar').style.width=state.home.filter(Boolean).length/3*100+'%';}});
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-place]');if(!b)return;if(b.dataset.page!==undefined){nav(Number(b.dataset.page));return;}if(b.dataset.say){speak(b.dataset.say);return;}if(b.dataset.phrase!==undefined){speak(phrases[Number(b.dataset.phrase)][1]);return;}if(b.dataset.meaning!==undefined){const el=$('#meaning'+b.dataset.meaning);el.classList.toggle('hidden');b.textContent=el.classList.contains('hidden')?'看中文':'收起中文';b.setAttribute('aria-expanded',!el.classList.contains('hidden'));return;}if(b.dataset.role){role=b.dataset.role;pairHelp=false;render();return;}if(b.dataset.rating){const [i,j]=b.dataset.rating.split(',').map(Number);state.ratings[i]=j;save();const parent=b.parentElement;parent.querySelectorAll('button').forEach(btn=>btn.setAttribute('aria-pressed',btn===b));toast('已記錄這項能力。');return;}if(b.dataset.place){if(page===2){listenCorrect=b.dataset.place===places[listenIndex].id;listenFeedback=listenCorrect?'找到了！目的地是 '+places[listenIndex].en+'（'+places[listenIndex].zh+'）。再用手指出一次路線。':'再試一次：注意第幾個路口，以及左轉還是右轉。';render();}if(page===6){homeListenCorrect=b.dataset.place==='pharmacy';homeFeedback=homeListenCorrect?'找到了！第一個路口右轉，到藥局。':'還沒找到。請再聽一次，注意 first 和 right。';render();}return;}
switch(b.dataset.act){case'save-first':if(!state.before.trim()){toast('先記下幾個你會說的字，再保留這次嘗試。');$('#before').focus();}else{save();toast('已保留。課程最後會和這次的答案比較。');}break;case'listen':speak(places[listenIndex].listen);break;case'listen-slow':speak(places[listenIndex].listen,.62);break;case'listen-text':listenText=!listenText;render();break;case'listen-next':listenIndex=(listenIndex+1)%places.length;listenText=false;listenFeedback='';listenCorrect=false;if('speechSynthesis'in window)speechSynthesis.cancel();render();break;case'hint':hintLevel=Math.min(3,hintLevel+1);render();break;case'hide-hint':hintLevel=0;render();break;case'reply':showReply=true;render();speak(situations[situation].reply);break;case'follow-hint':followHint=!followHint;render();break;case'pair-next':pairIndex=(pairIndex+1)%places.length;role='A';pairHelp=false;pairEvent=false;render();break;case'pair-help':pairHelp=!pairHelp;render();break;case'pair-event':pairEvent=!pairEvent;render();break;case'export':exportWork();break;case'home-listen':speak(places[3].listen);break;case'home-text':homeListenText=!homeListenText;render();break;}
});
document.addEventListener('keydown',e=>{if(e.target.matches('[data-place]')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
$('#projection').addEventListener('click',()=>{document.body.classList.toggle('projection');const active=document.body.classList.contains('projection');$('#projection').setAttribute('aria-pressed',active);$('#projection').textContent=active?'還原文字大小':'放大教室文字';});
$('#export').addEventListener('click',exportWork);
render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'open_lesson_step',description:'Open a travel English lesson step. Does not complete exercises or change student answers.',inputSchema:{type:'object',properties:{step:{type:'integer',minimum:1,maximum:7}},required:['step'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||!Number.isInteger(input.step)||input.step<1||input.step>7)throw new Error('step must be 1 to 7');nav(input.step-1);return{step:page+1,title:steps[page]};}})).catch(()=>{});}catch(e){}}
</script>
</body>
