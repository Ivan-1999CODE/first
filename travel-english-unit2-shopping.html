{id:'gifts',en:'Gift Shop',zh:'禮品店',x:100,y:240,turn:'left',junction:1,goal:'買一份送朋友的小禮物，預算只有 10 美元。',item:'a gift',words:'gift · mug · ten dollars · cheaper',starter:'I’m looking for… / How much…? / Do you have…?',example:'I’m looking for a gift. How much is this mug?',reply:'It’s twelve dollars.',challenge:'杯子超過你的預算。你要怎麼說明預算，或詢問便宜一點的商品？',follow:'I have ten dollars. Do you have something cheaper?',answer:'This magnet is four dollars.',stock:'Mug（杯子）$12；Magnet（磁鐵）$4。兩種都還有貨，可付現或刷卡。',end:'I’ll take the magnet. Can I pay by card?',steps:['straight','left','straight']},
{id:'clothes',en:'Clothes',zh:'服飾店',x:500,y:240,turn:'right',junction:1,goal:'買一件 M 號的 T-shirt。你比較喜歡藍色，但也願意考慮其他顏色。',item:'a T-shirt',words:'T-shirt · medium · blue · black',starter:'I’m looking for… / Do you have…? / Can I…?',example:'I’m looking for a T-shirt. Do you have this in medium?',reply:'Yes. We have medium in black, but not in blue.',challenge:'藍色的 M 號沒貨。你想先試穿黑色的，會怎麼說？',follow:'Can I try on the black one?',answer:'Of course. The fitting room is over there. It’s twenty dollars.',stock:'T-shirt $20：黑色有 M 號；藍色只有 L 號。可試穿，可付現或刷卡。',end:'It fits. I’ll take it. Can I pay by card?',steps:['straight','right','straight']},
{id:'shoes',en:'Shoes',zh:'鞋店',x:100,y:90,turn:'left',junction:2,goal:'找一雙 8 號的鞋，想先確認尺寸，再決定要不要買。',item:'shoes',words:'shoes · size eight · another pair · try on',starter:'Do you have…? / Can I try…? / I’ll…',example:'Do you have these shoes in size eight?',reply:'Sorry, these sneakers are only available in size nine.',challenge:'這款球鞋沒有你的尺寸。你想詢問另一雙，接著怎麼說？',follow:'Do you have another pair in size eight?',answer:'Yes. These sandals come in size eight. They’re thirty dollars.',stock:'Sneakers（球鞋）$40：只有 9 號。Sandals（涼鞋）$30：有 8 號。可試穿，可付現或刷卡。',end:'Can I try them on? / No, thank you. I’m looking for sneakers.',steps:['straight','straight','left','straight']},

let state={before:'',after:'',drafts:['','','',''],followups:['','','',''],closing:['','','',''],ratings:[-1,-1,-1,-1],home:[false,false,false],homeAnswer:''};
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&typeof raw==='object'){for(const k of ['before','after','homeAnswer'])if(typeof raw[k]==='string')state[k]=raw[k];for(const k of ['drafts','followups','closing'])if(Array.isArray(raw[k]))state[k]=state[k].map((_,i)=>typeof raw[k][i]==='string'?raw[k][i]:'');if(Array.isArray(raw.ratings))state.ratings=state.ratings.map((_,i)=>[-1,0,1,2].includes(raw.ratings[i])?raw.ratings[i]:-1);if(Array.isArray(raw.home))state.home=state.home.map((_,i)=>raw.home[i]===true);}}catch(e){$('#storageNotice').hidden=false;}
let page=0,shop=0,leg=0,routeText=false,routeMessage='',routeError=false,hint=0,reply=false,followHint=false,answer=false,role='A',roleHelp=false,homeFeedback='',homeCorrect=false,homeText=false,timer;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){$('#storageNotice').hidden=false;}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,3500);}
function speak(t,rate=.82){if(!('speechSynthesis'in window)){toast('此裝置無法朗讀，請展開文字，由老師示範。');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate;const v=speechSynthesis.getVoices().find(v=>v.lang==='en-US');if(v)u.voice=v;u.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))toast('朗讀未能播放，請展開文字練習。');};speechSynthesis.speak(u);}
function route(s){return 'Go straight to the '+(s.junction===1?'first':'second')+' intersection. Turn '+s.turn+'. Go straight to the end of the road.';}
function resetRoute(){leg=0;routeText=false;routeMessage='';routeError=false;}
function chooseShop(i){shop=i;resetRoute();hint=0;reply=false;followHint=false;answer=false;role='A';roleHelp=false;if('speechSynthesis'in window)speechSynthesis.cancel();render();}
function nav(i){page=Math.max(0,Math.min(6,i));if('speechSynthesis'in window)speechSynthesis.cancel();render();$('#main').focus();window.scrollTo({top:0});}
function field(id,label,value,ph){return `<label class="field" for="${id}">${label}</label><textarea id="${id}" spellcheck="false" placeholder="${ph}">${esc(value)}</textarea>`;}
function teacher(t){return `<details class="teacher"><summary>老師帶課筆記</summary><p>${t}</p></details>`;}
function selector(){return `<label class="field" for="shop">今天去哪一家？</label><select id="shop">${shops.map((s,i)=>`<option value="${i}" ${shop===i?'selected':''}>${s.zh} · ${s.en}</option>`).join('')}</select>`;}
function routeState(s,n){let x=300,y=390,d=0;const points=[[x,y]];for(let i=0;i<n;i++){const cmd=s.steps[i];if(cmd==='left')d=-90;else if(cmd==='right')d=90;else{if(d===0)y-=150;else x+=d===90?200:-200;points.push([x,y]);}}return{x,y,d,points:points.map(p=>p.join(',')).join(' ')};}
function map(s=null,n=0,interactive=false){const pos=s?routeState(s,n):{x:300,y:390,d:0,points:''};return `<div class="map"><svg viewBox="0 0 600 470" role="group" aria-label="購物街地圖。從下方飯店出發，第一個路口左側禮品店、右側服飾店，第二個路口左側鞋店、右側超市。"><path d="M100 90H500 M100 240H500 M300 60V395" stroke="white" stroke-width="42" stroke-linecap="round"/><path d="M100 90H500 M100 240H500 M300 60V395" stroke="#c4d0df" stroke-width="2" stroke-dasharray="7 7"/><text x="300" y="143" text-anchor="middle" fill="#53627b" font-size="16">第 2 個路口</text><text x="300" y="293" text-anchor="middle" fill="#53627b" font-size="16">第 1 個路口</text><text x="556" y="35" fill="#53627b" font-size="18">N ↑</text>${s&&n?`<polyline class="route" points="${pos.points}"/>`:''}${shops.map(p=>`<g class="map-place" ${interactive?`role="button" tabindex="0" data-place="${p.id}" aria-label="選擇 ${p.zh}"`:''}><rect x="${p.x-87}" y="${p.y-35}" width="174" height="70" rx="12"/><text x="${p.x}" y="${p.y-3}">${p.en}</text><text class="zh" x="${p.x}" y="${p.y+22}">${p.zh}</text></g>`).join('')}<g transform="translate(${pos.x} ${s&&n===s.steps.length?pos.y+57:pos.y}) rotate(${pos.d})"><circle r="20" fill="#f5b456" stroke="white" stroke-width="4"/><path d="M0-13L-8 7 0 3 8 7z" fill="#172a49"/></g><text x="300" y="444" text-anchor="middle" fill="#344761" font-size="19" font-weight="700">HOTEL · 飯店起點</text></svg><p class="map-caption">教學用購物街 · 箭頭代表你面朝的方向</p></div>`;}
function hints(s){return `<div class="actions"><button data-act="hint" ${hint===3?'disabled':''}>${['需要關鍵詞','看句子開頭','看一種參考說法','提示已展開'][hint]}</button>${hint?'<button data-act="hide">收起提示再試</button>':''}</div>${hint>0?`<div class="hint"><small>關鍵詞</small><p class="en">${s.words}</p></div>`:''}${hint>1?`<div class="hint"><small>句子開頭</small><p class="en">${s.starter}</p></div>`:''}${hint>2?`<div class="hint"><small>其中一種說法，不是唯一答案</small><p class="en big-en">${s.example}</p><button data-say="${esc(s.example)}">▶ 聽參考</button></div>`:''}`;}

 if(page===0)h=`<div class="grid"><section class="card navy"><p class="eyebrow" style="color:#c0caff">DAY 02 / SHOPPING DAY</p><p class="scenario">早餐後，從飯店出發。<br>今天要買一份送朋友的<strong style="color:#ffc77b">小禮物</strong>。</p><p>你只有 10 美元。到了店裡，看上一個杯子，想知道價格，也想問能不能刷卡。</p><div class="journey"><span>01 找到店</span><span>02 說出需求</span><span>03 回應與結帳</span></div><p class="tiny muted">本單元的價格皆為教學情境，使用美元。</p></section><section class="card">${field('before','先試著和店員說幾句',state.before,'說出你想買什麼，再問價格和付款方式。只會單字也可以。')}<div class="actions"><button class="primary" data-act="save-first">保留我的第一次嘗試</button><button data-page="2">先看看購物街 →</button></div><p class="note">先說再寫。不必查答案，最後會回來比較。</p></section></div>${teacher('這是第二天的故事，延續第一單元的問路能力。建議 2 堂各 50 分鐘：第一堂課前紀錄 5、隨身句 10、導航 15、購物對話 20；第二堂暖身 5、雙人任務 25、前後比較 15、說明課後任務 5。學生較弱時先用禮品店與服飾店。')}`;

 if(page===3)h=`<div class="grid"><section class="card">${selector()}<p class="eyebrow">IN THE SHOP</p><p class="scenario">${s.goal}</p><p>想一想：你要買什麼？有什麼條件？還要問哪一件事？</p>${hints(s)}<p class="note">先用自己的英文說。可以說短句，也可以決定不買。</p></section><section class="card">${field('draft','我先對店員說',state.drafts[shop],'先說商品與需求，再問一個問題。')}<button class="primary" data-act="reply">看看店員提供的新資訊 →</button>${reply?`<div class="hint"><small>情境中的店員回答</small><p class="en big-en">${s.reply}</p><button data-say="${esc(s.reply)}">▶ 聽回答</button></div><p><strong>${s.challenge}</strong></p>${field('followup','根據新資訊，我接著說',state.followups[shop],'先想自己要怎麼回應，不必照範例。')}<div class="actions"><button data-act="follow-hint">${followHint?'收起參考':'需要一句參考'}</button><button data-act="answer">繼續這段對話</button></div>${followHint?`<p class="hint en">${s.follow}</p>`:''}`:''}${answer?`<div class="hint"><p class="en big-en">${s.answer}</p><button data-say="${esc(s.answer)}">▶ 聽後續資訊</button></div>${field('closing','我的決定：購買、追問或不買',state.closing[shop],'試著把這段對話結束。')}<details><summary>看一種結尾說法</summary><p class="en hint">${s.end}</p></details>`:''}<div class="note">以上為預設劇情，不會自動判斷你的句子。若你選擇不同回應，請老師接續對話。</div></section></div>${teacher('先檢查意思是否清楚，再修正一個影響理解的地方。若學生說的內容與預設回覆不吻合，老師可以替代店員回答。把提示收起來，換同學再說一次。')}`;
 if(page===4)h=`${selector()}<div class="role-tabs"><button data-role="A" aria-pressed="${role==='A'}">A｜旅行者</button><button data-role="B" aria-pressed="${role==='B'}">B｜路人 → 店員</button></div>${role==='A'?`<div class="grid"><section class="card navy"><div class="role-letter">A</div><h2>今天要去 ${s.en} · ${s.zh}</h2><p class="scenario">${s.goal}</p><p class="muted">① 問路並用手指出方向。<br>② 到店說明需求、問價格。<br>③ 聽新資訊，決定追問、購買或不買。</p></section><section class="card"><h2>讓對方聽懂你的需要</h2><p>請 B 先當路人，走到店家後再換成店員。問完才會知道商品的價格與庫存。</p><button data-act="role-help">${roleHelp?'收起提示':'需要開頭提示'}</button>${roleHelp?`<p class="hint en big-en">Where is the ${s.id==='clothes'?'clothes shop':s.id==='shoes'?'shoe shop':s.en.toLowerCase()}?<br>I’m looking for…<br>How much…?<br>Do you have…?</p>`:''}<div class="note">同一螢幕請輪流查看角色卡。完成後交換角色，換店家再試。</div></section></div>`:`<div class="grid"><section class="card"><p class="eyebrow">ROLE B / INFORMATION CARD</p><h2>先當路人，再當店員</h2><p class="en big-en">${route(s)}</p><button data-say="${route(s)}">▶ 聽路線</button><div class="hint"><h3>只有你知道的店內資訊</h3><p>${s.stock}</p></div><details><summary>店員回答參考：等對方問了再看</summary><p class="en">${s.reply}</p><p class="en">${s.answer}</p><button data-say="${esc(s.reply)}">▶ 聽回答</button></details><div class="note">不要一次把全部資訊告訴旅客。等他問、給他追問的機會。遇到沒聽懂，就換短一點的說法。</div></section>${map(s,s.steps.length)}</div>`}${teacher('B 卡有價格與庫存，A 卡只有需求，形成資訊差。角色切換不是保密機制，請輪流看畫面。回饋聚焦四件事：找到店、說出需求、因新資訊調整、結束對話。')}`;
 if(page===5)h=`<section class="card tinted"><p class="eyebrow">ONE MORE TRY</p><h2>換一份禮物：你想買一個購物袋，預算仍是 10 美元。</h2><p>試著說出商品、問價格與付款方式。先自己說完，再讓同學扮演店員。</p><details><summary>店員看這裡：等對方問完再回答</summary><p class="en big-en">This bag is fifteen dollars. That small one is eight dollars. You can pay by card.</p><p>大袋 $15、小袋 $8，可刷卡。讓旅行者自己決定要怎麼接話。</p></details>${field('after','這次我的購物對話',state.after,'先不看提示，試著寫下你說的英文。')}</section><div class="grid equal separate"><section class="card"><p class="eyebrow">BEFORE / 買杯子</p><h2>第一次的我</h2><p class="compare-text en">${esc(state.before)||'尚未記錄，可回第 1 步補上。'}</p></section><section class="card"><p class="eyebrow">AFTER / 買購物袋</p><h2>現在的我</h2><p class="compare-text en" id="afterCompare">${esc(state.after)||'上方輸入後，會同步出現在這裡。'}</p></section></div><section class="card separate"><h2>和老師一起確認</h2><div class="rating">${['聽懂路線，找到店家','說出商品與條件','問價格與付款方式','根據新資訊追問或做決定'].map((t,i)=>`<div class="rating-row"><strong>${t}</strong><div class="actions">${['看範例完成','看關鍵詞完成','獨立完成'].map((r,j)=>`<button data-rating="${i},${j}" aria-pressed="${state.ratings[i]===j}">${r}</button>`).join('')}</div></div>`).join('')}</div><p class="note">這是自我檢核，不是自動評分。導航能力請根據剛才的地圖任務記錄。</p><button class="primary separate" data-act="export">匯出第二單元紀錄</button></section>${teacher('先比較同樣的三項需求：說商品、問價、付款。追問替代品是延伸能力。地圖表現獨立觀察，不從文字答案推斷。下次課堂換一組商品，確認學生仍然會說。')}`;
 if(page===6)h=`<section class="card" style="margin-bottom:20px"><h2>今天的 3 個小練習</h2><span id="homeCount">${state.home.filter(Boolean).length} / 3 已練習</span><div class="progress-track"><div id="homeBar" style="width:${state.home.filter(Boolean).length/3*100}%"></div></div><p class="tiny muted">自己勾選練習紀錄，並不代表能力評分。</p></section><div class="grid"><section class="card"><p class="eyebrow">01 / FIND THE SHOP</p><h2>聽路線，再點選店家</h2><div class="actions"><button class="primary" data-act="home-listen">▶ 聽路線</button><button data-act="home-text">${homeText?'收起文字':'看英文路線'}</button></div>${homeText?`<p class="hint en">${route(shops[2])}</p>`:''}${map(homeCorrect?shops[2]:null,homeCorrect?4:0,true)}<div class="feedback ${homeFeedback&&!homeCorrect?'retry':''}" role="status">${homeFeedback}</div><div class="checklist"><label><input type="checkbox" data-home="0" ${state.home[0]?'checked':''}>我聽過並完成找店練習</label></div></section><div class="stack"><section class="card"><p class="eyebrow">02 / HANDLE A CHANGE</p><h2>想買的帽子太貴了</h2><p>帽子 $18，你只有 $12。先大聲說出你會怎麼問，再看參考。</p><details><summary>我說完了，看一種說法</summary><p class="hint en big-en">I have twelve dollars. Do you have something cheaper?</p><button data-say="I have twelve dollars. Do you have something cheaper?">▶ 聽參考</button></details><div class="checklist"><label><input type="checkbox" data-home="1" ${state.home[1]?'checked':''}>我收起參考後再說了一次</label></div></section><section class="card"><p class="eyebrow">03 / MY SHOPPING PLAN</p><h2>換成你真正想買的東西</h2>${field('homeAnswer','我想買什麼？條件是什麼？要問什麼？',state.homeAnswer,'例如：買一雙適合走路的鞋，想試穿、問尺寸和價格。請試著寫英文。')}<div class="checklist"><label><input type="checkbox" data-home="2" ${state.home[2]?'checked':''}>我已把自己的句子大聲說出來</label></div><p class="tiny muted">下次上課帶給老師看，一次改進一個地方。</p></section></div></div>`;

function move(cmd){const s=shops[shop];if(leg>=s.steps.length)return;if(cmd===s.steps[leg]){leg++;routeError=false;routeMessage=leg===s.steps.length?'抵達 '+s.zh+'！現在試著向店員說出你的需要。':'方向正確。'+(cmd==='straight'?'到下一個位置了，繼續聽路線。':'已轉向，接著要怎麼走？');}else{routeError=true;routeMessage='這一步與路線不同，位置沒有改變。再聽一次，注意路口和轉彎方向。';}render();}
function exportWork(){const rows=['TRAVEL LAB｜第二天：購物任務','','【課前】',state.before||'尚未作答','','【課後】',state.after||'尚未作答'];shops.forEach((s,i)=>rows.push('',s.zh,'我的開場：'+state.drafts[i],'我的回應：'+state.followups[i],'我的決定：'+state.closing[i]));rows.push('','【能力自評】');['找到店','說需求','問價格與付款','回應與決定'].forEach((t,i)=>rows.push(t+'：'+(['看範例完成','看關鍵詞完成','獨立完成'][state.ratings[i]]||'未評估')));rows.push('','【課後購物計畫】',state.homeAnswer,'已練習：'+state.home.filter(Boolean).length+'/3');const url=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='第二單元_我的購物英文.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('第二單元紀錄已匯出。');}
document.addEventListener('input',e=>{const id=e.target.id;if(['before','after','homeAnswer'].includes(id)){state[id]=e.target.value;if(id==='after')$('#afterCompare').textContent=e.target.value;save();}const keys={draft:'drafts',followup:'followups',closing:'closing'};if(keys[id]){state[keys[id]][shop]=e.target.value;save();}});
document.addEventListener('change',e=>{if(e.target.id==='shop')chooseShop(Number(e.target.value));if(e.target.matches('[data-home]')){state.home[Number(e.target.dataset.home)]=e.target.checked;save();$('#homeCount').textContent=state.home.filter(Boolean).length+' / 3 已練習';$('#homeBar').style.width=state.home.filter(Boolean).length/3*100+'%';}});
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-place]');if(!b||b.disabled)return;if(b.dataset.page!==undefined){nav(Number(b.dataset.page));return;}if(b.dataset.say){speak(b.dataset.say);return;}if(b.dataset.move){move(b.dataset.move);return;}if(b.dataset.meaning!==undefined){const el=$('#meaning'+b.dataset.meaning);el.hidden=!el.hidden;b.setAttribute('aria-expanded',!el.hidden);b.textContent=el.hidden?'看中文':'收起中文';return;}if(b.dataset.role){role=b.dataset.role;roleHelp=false;render();return;}if(b.dataset.rating){const [i,j]=b.dataset.rating.split(',').map(Number);state.ratings[i]=j;save();b.parentElement.querySelectorAll('button').forEach(el=>el.setAttribute('aria-pressed',el===b));return;}if(b.dataset.place){homeCorrect=b.dataset.place==='shoes';homeFeedback=homeCorrect?'找到了！第二個路口左轉，到鞋店。':'再試一次：注意 second intersection 和 left。';render();return;}
