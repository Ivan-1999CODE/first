document.addEventListener('input',e=>{const id=e.target.id;if(['before','after','homeAnswer'].includes(id)){state[id]=e.target.value;if(id==='after')$('#afterCompare').textContent=e.target.value;save();}const keys={draft:'drafts',followup:'followups',closing:'closing'};if(keys[id]){state[keys[id]][shop]=e.target.value;save();}});
document.addEventListener('change',e=>{if(e.target.id==='shop')chooseShop(Number(e.target.value));if(e.target.matches('[data-home]')){state.home[Number(e.target.dataset.home)]=e.target.checked;save();$('#homeCount').textContent=state.home.filter(Boolean).length+' / 3 已練習';$('#homeBar').style.width=state.home.filter(Boolean).length/3*100+'%';}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.clerkProduct){selectClerkProduct(b.dataset.clerkProduct);return;}if(b.dataset.clothing!==undefined){clothingAction(Number(b.dataset.clothing));return;}if(b.dataset.page!==undefined){nav(Number(b.dataset.page),!!b.closest('#nav'));return;}if(b.dataset.say){speak(b.dataset.say);return;}if(b.dataset.meaning!==undefined){const el=$('#meaning'+b.dataset.meaning);el.hidden=!el.hidden;b.setAttribute('aria-expanded',!el.hidden);b.textContent=el.hidden?'看中文':'收起中文';return;}if(b.dataset.role){stopClerkAudio();role=b.dataset.role;roleHelp=false;render();return;}if(b.dataset.rating){const [i,j]=b.dataset.rating.split(',').map(Number);state.ratings[i]=j;save();b.parentElement.querySelectorAll('button').forEach(el=>el.setAttribute('aria-pressed',el===b));return;}
switch(b.dataset.act){case'clerk-listen':playCustomer();break;case'clerk-slow':playCustomer(true);break;case'clerk-text':clerkText=!clerkText;if(clerkStage==='request')clerkHeard=true;else clerkPriceHeard=true;render();break;case'clerk-hint':clerkHint=!clerkHint;render();break;case'clerk-spoken':if(clerkPriceHeard){clerkSpoken=true;render();}break;case'clerk-complete':if(clerkStage==='price'&&clerkSpoken){stopClerkAudio();clerkStage='done';clerkFeedback='商品選對，也已練習報價。換下一位顧客吧！';render();}break;case'clerk-next':if(clerkStage==='done')resetClerk(true);break;case'clerk-reset':resetClerk();break;case'clothing-spoken':clothingSpoken=true;render();break;case'clothing-answer':if(clothingHint&&!clothingAnswer){clothingConfirm=true;render();$('#answerConfirmTitle').focus();}break;case'clothing-cancel-answer':clothingConfirm=false;render();$('[data-act=clothing-answer]').focus();break;case'clothing-confirm-answer':if(clothingConfirm&&clothingHint){clothingConfirm=false;clothingAnswer=true;render();$('[data-act=clothing-hide-answer]').focus();}break;case'clothing-hide-answer':clothingAnswer=false;render();break;case'clothing-reset':clothingConfirm=false;clothingSpoken=false;clothingAnswer=false;clothingScene='welcome';clothingColor='blue';clothingSize='M';clothingHistory=[];clothingText=false;clothingHint=false;if('speechSynthesis'in window)speechSynthesis.cancel();render();break;case'clothing-slow':speak(clothingScenesNow()[clothingScene].line,.62);break;case'clothing-text':clothingText=!clothingText;render();break;case'clothing-hint':clothingHint=!clothingHint;if(!clothingHint){clothingAnswer=false;clothingConfirm=false;}render();break;case'save-first':if(state.before.trim()){save();toast('已保留第一份答案。');}else{$('#before').focus();toast('先記下幾個你會說的字。');}break;case'hint':hint=Math.min(3,hint+1);render();break;case'hide':hint=0;render();break;case'reply':reply=true;render();speak(shops[shop].reply);break;case'follow-hint':followHint=!followHint;render();break;case'answer':answer=true;render();speak(shops[shop].answer);break;case'role-help':roleHelp=!roleHelp;render();break;case'home-listen':speak('We have medium in black, but not in blue.');break;case'home-text':homeText=!homeText;render();break;case'export':exportWork();break;}});
$('#projection').addEventListener('click',()=>{const active=document.body.classList.toggle('projection');$('#projection').setAttribute('aria-pressed',active);$('#projection').textContent=active?'還原文字大小':'放大教室文字';});$('#export').addEventListener('click',exportWork);render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'open_shopping_lesson_step',description:'Open a shopping lesson step without completing exercises or changing student answers.',inputSchema:{type:'object',properties:{step:{type:'integer',minimum:1,maximum:7}},required:['step'],additionalProperties:false},execute(input){if(!Number.isInteger(input?.step)||input.step<1||input.step>7)throw Error('step must be 1 to 7');nav(input.step-1);return{step:page+1,title:steps[page]};}})).catch(()=>{});}catch(e){}}
</script></body></html>
