<style id="course-palette-styles">

:root[data-course-palette=apricot]{--course-hue:30;--course-saturation:54%}
:root[data-course-palette=butter]{--course-hue:46;--course-saturation:52%}
:root[data-course-palette=rose]{--course-hue:350;--course-saturation:34%}
:root[data-course-palette=mauve]{--course-hue:285;--course-saturation:24%}
:root[data-course-palette=latte]{--course-hue:26;--course-saturation:20%}
:root[data-course-palette][data-theme=light]{
 --bg:hsl(var(--course-hue) var(--course-saturation) 94%);
 --panel:hsl(var(--course-hue) 35% 99%);
 --ink:hsl(var(--course-hue) 18% 20%);
 --muted:hsl(var(--course-hue) 14% 37%);
 --line:hsl(var(--course-hue) 22% 73%);
 --accent:hsl(var(--course-hue) var(--course-saturation) 31%);
 --soft:hsl(var(--course-hue) var(--course-saturation) 89%);
 --on-accent:#fffdf8;
 --neutral:hsl(var(--course-hue) 16% 81%);
 --hear-bg:var(--soft);--hear-ink:var(--accent);--hear-line:hsl(var(--course-hue) 30% 56%);
 --say-bg:#fff3d8;--say-ink:#654916;--say-line:#b48a3c;
}
:root[data-course-palette][data-theme=dark]{
 --course-hue:30;--course-saturation:54%;

 --panel:hsl(var(--course-hue) 14% 22%);
 --ink:hsl(var(--course-hue) 30% 94%);
 --muted:hsl(var(--course-hue) 20% 77%);
 --line:hsl(var(--course-hue) 18% 48%);
 --accent:hsl(var(--course-hue) var(--course-saturation) 78%);
 --soft:hsl(var(--course-hue) 20% 28%);
 --on-accent:hsl(var(--course-hue) 22% 18%);
 --neutral:hsl(var(--course-hue) 13% 39%);

}

 :root[data-course-palette][data-theme=light]{--muted:#403832;--line:#77685e}

<style id="responsive-layout-styles">

 .unit-menu>summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fields=['before','after','home',...missions.map(m=>'mission-'+m.id),...pairs.map(p=>'note-'+p.id)];
const defaultState=()=>({answers:Object.fromEntries(fields.map(k=>[k,''])),checks:Object.fromEntries(pairs.map(p=>[p.id,p.goals.map(()=>false)])),ratings:Object.fromEntries(course.skills.map(s=>[s.id,0])),complete:[],home:{listen:false,written:false,spoken:false}});
let state=defaultState(),storageFailed=false;
function load(){try{const raw=localStorage.getItem(course.id);if(!raw){migrateLegacy();return;}const saved=JSON.parse(raw);if(!saved||typeof saved!=='object'||Array.isArray(saved))throw Error('invalid');if(saved.legacy&&typeof saved.legacy==='object')state.legacy=saved.legacy;for(const k of fields)if(typeof saved.answers?.[k]==='string')state.answers[k]=saved.answers[k];for(const p of pairs)if(Array.isArray(saved.checks?.[p.id]))state.checks[p.id]=p.goals.map((_,i)=>saved.checks[p.id][i]===true);for(const s of course.skills)if([0,1,2,3].includes(saved.ratings?.[s.id]))state.ratings[s.id]=saved.ratings[s.id];if(Array.isArray(saved.complete))state.complete=flows.map(f=>f.id).filter(id=>saved.complete.includes(id));for(const k of Object.keys(state.home))state.home[k]=saved.home?.[k]===true;}catch{storageFailed=true;}}
function migrateLegacy(){for(const key of course.legacyKeys){const raw=localStorage.getItem(key);if(!raw)continue;const old=JSON.parse(raw);if(!old||typeof old!=='object'||Array.isArray(old))continue;state.legacy=old;if(typeof old.before==='string')state.answers.before=old.before;break;}}
function save(){try{localStorage.setItem(course.id,JSON.stringify(state));}catch{storageFailed=true;showStorage();}}
function showStorage(){const n=$('#storageNotice');n.hidden=!storageFailed;if(storageFailed)n.textContent='此瀏覽器目前無法讀取或保存紀錄；你仍可練習，但關閉後可能不保留本次作答。';}
let page=0,mode='library',reply=0,mission=0,pair=0,flow=0,turn=0,history=[],heard=false,spoken=false,choice=-1,feedback='',finished=false;
let quizChoices={},toastTimer;
function stopAudio(){if(window.speechSynthesis)window.speechSynthesis.cancel();}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,5500);}
function speak(text,slow=false){stopAudio();if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){toast('此瀏覽器無法朗讀；請展開英文與中文，讀完後照樣能練習。');return;}try{const u=new window.SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=slow?.72:.94;u.onerror=()=>toast('朗讀未能播放；請展開英文與中文繼續。');window.speechSynthesis.speak(u);}catch{toast('朗讀未能播放；請展開英文與中文繼續。');}}
const btn=(text,data='',extra='')=>`<button type="button" ${data} ${extra}>${text}</button>`;
const audio=en=>`<div class="actions">${btn('▶ 聽英文',`data-say="${esc(en)}"`)}${btn('慢速',`data-say="${esc(en)}" data-slow="true"`)}</div>`;
const transcript=(en,zh)=>`<details><summary>對方英文與中文</summary><p class="en" lang="en">${esc(en)}</p><p>${esc(zh)}</p></details>`;
const flowTranscript=(en,zh,readingHtml='')=>`<details class="flow-transcript"><summary>對方英文與中文</summary><p class="en" lang="en">${esc(en)}</p><p class="flow-translation" lang="zh-Hant"><span>中文意思：</span>${esc(zh)}</p>${readingHtml}</details>`;
let hint=(words,answer,answerZh=typeof answerTranslations==='object'?answerTranslations[answer]||'':'')=>`<details><summary>需要一點關鍵字</summary><p class="hint" lang="en">${esc(words)}</p><details><summary>完整參考說法</summary><p class="en" lang="en">${esc(answer)}</p>${answerZh?`<p class="reference-translation" lang="zh-Hant"><span>中文意思：</span>${esc(answerZh)}</p>`:''}${audio(answer)}<p class="fine">這是一種可用的說法，不必逐字相同。</p></details></details>`;
const field=(key,label)=>`<label for="field-${key}">${esc(label)}</label><textarea id="field-${key}" data-field="${key}" placeholder="單字、短句都可以，先留下自己的說法。">${esc(state.answers[key])}</textarea><p class="fine">輸入時自動保存在此瀏覽器；不同裝置、網址或瀏覽器不會自動同步。</p>`;
const check=(id,label,on,disabled=false)=>`<label class="checkline"><input type="checkbox" ${id} ${on?'checked':''} ${disabled?'disabled':''}> <span>${esc(label)}</span></label>`;
let tabs=(items,key,current)=>`<div class="tabs" aria-label="情境選擇">${items.map((x,i)=>btn(esc(x.name),`data-${key}="${i}"`,`aria-pressed="${i===current}"`)).join('')}</div>`;
const head=(sub,desc)=>`<div class="eyebrow">DAY ${course.day} / ${String(page+1).padStart(2,'0')}</div><h1>${esc(course.labels[page])}</h1><p class="lead muted">${esc(desc||sub)}</p>`;
function intro(){return `<section class="hero home-hero"><div class="hero-copy"><p class="eyebrow">DAY ${course.day} / TRAVEL LAB</p><h1>${esc(course.title).replace('，','，<br>')}</h1><p class="lead">${esc(course.description)}</p></div><div class="hero-art">${course.art}</div></section><section class="panel before-panel"><h2>先試著說，不急著找答案。</h2><p class="task">${esc(course.task)}</p>${field('before','第一次的嘗試')}<p class="fine">單字或短句也可以，第六部分再比較。</p></section><div class="section-title"><h2>今天的任務</h2><span>${state.complete.length} / ${flows.length} 已練習</span></div><div class="cards">${flows.map((f,i)=>`<section class="panel"><h3>${esc(f.name)} ${state.complete.includes(f.id)?'✓':''}</h3><p>${esc(f.desc)}</p>${btn('進入情境 →',`data-start="${i}"`)}</section>`).join('')}</div>${btn('先學隨身句 →','data-page="1"')}`;}
function phrasePage(){let content='';if(mode==='library')content=`<div class="grid">${phrases.map((p,i)=>`<article class="panel"><div class="eyebrow">${String(i+1).padStart(2,'0')} / ${esc(p.use)}</div><p class="en" lang="en">${esc(p.en)}</p><details><summary>看中文意思</summary><p>${esc(p.zh)}</p></details>${audio(p.en)}</article>`).join('')}</div>${course.day===1?'':`<section class="panel supplement"><h2>用語小提醒</h2><p>${esc(course.tip)}</p></section>`}`;else{const r=replies[reply];content=replyCard(r);}return head('', '先找自己想表達的意思，再練習接住對方的一句話。')+`<div class="modes">${btn(`我想怎麼說<small>${phrases.length} 句隨身英文</small>`,'data-mode="library"',`aria-pressed="${mode==='library'}"`)}${btn(`${esc(course.replyRole)}問，我來答<small>${replies.length} 組情境問答</small>`,'data-mode="reply"',`aria-pressed="${mode==='reply'}"`)}</div><p class="fine">直接開口練習即可；這裡不錄音，也不自動評分。</p>`+content;}
function selected(id){const n=flows[flow].steps.findIndex(t=>t.id===id);return history[n];}
function currentStep(){return lessonStep(flows[flow],turn,selected);}
function sceneState(){return lessonScene(flows[flow],history,finished);}
function objectArt(t,i){return `<span class="object-icon" aria-hidden="true">${esc(t.objects[i][0])}</span>`;}
function accepted(t,i){return Number.isInteger(i)&&t.valid.includes(i);}
function canNext(){return !finished&&heard&&spoken&&accepted(currentStep(),choice);}
function scenePage(){const f=flows[flow],t=currentStep();let content;
 if(finished)content=`<section class="panel"><p class="eyebrow">READY TO GO</p><h2>${esc(f.name)}：流程完成</h2>${sceneState()}<p class="task">${esc(f.summary)}</p><p>✓ 完成標記會保留；重練可重新做選擇。</p><div class="actions">${btn('再練一次',`data-start="${flow}"`)}${btn('換另一趟任務',`data-start="${(flow+1)%flows.length}"`)}${btn('換個情況說說看 →','data-page="3"')}</div></section>`;
 else content=`<section class="panel"><div class="section-title"><h2>${esc(f.name)}</h2>${btn('重新開始',`data-start="${flow}"`)}</div><p>${esc(f.context)}</p><p class="fine">依畫面提示聽讀、開口，再操作情境物件。勾選只是自我確認，不會錄音或辨識。</p><div class="scene-grid task-scene"><div class="dialogue-stack"><div class="eyebrow">第 ${turn+1} / ${f.steps.length} 步</div><div class="track">${f.steps.map((_,i)=>`<span class="${i<=turn?'done':''}"></span>`).join('')}</div>${guidedFlowTurns(t)}<div class="footer-actions">${btn('上一步','data-act="back"',turn===0?'disabled':'')}${btn(turn===f.steps.length-1?'完成流程 ✓':'下一步 →','data-act="next"',canNext()?'class="primary"':'disabled')}</div></div><div class="scene-board"><h3>③ ${esc(course.board)}</h3>${sceneState()}<p class="fine">${heard&&spoken?'點選符合剛才回覆的物件。':'完成兩項確認後，就能操作下方物件。'}</p><div class="objects">${t.objects.map(([,label],i)=>btn(`${objectArt(t,i)}<small>${esc(label)}${choice===i?' · 已選':''}</small>`,`data-choice="${i}"`,`class="object" aria-pressed="${choice===i}" ${heard&&spoken?'':'disabled'}`)).join('')}</div><div id="flowFeedback" role="status">${feedback?`<p class="feedback ${accepted(t,choice)?'':'retry'}">${esc(feedback)}</p>`:''}</div></div></div></section>`;
 return head('','把意思說出口，聽懂對方，再操作場景裡的物件。')+tabs(flows,'start',flow)+content;
}

function missionPage(){const m=missions[mission];return head('','先說，再記下自己的版本。不需要重走完整流程。')+tabs(missions,'mission',mission)+`<div class="grid"><section class="panel"><h2>${esc(m.name)}</h2><p class="task">${esc(m.task)}</p>${hint(m.words,m.answer,m.answerZh)}</section><section class="panel">${field('mission-'+m.id,'我的說法')}<p class="hint">一起核對：${esc(m.check)}</p></section></div>`;}
function pairPage(){const p=pairs[pair];return head('', '師生共看同一個畫面，自然接話；目標不必依清單順序完成。')+tabs(pairs,'pair',pair)+`<p>${esc(p.role)}</p><div class="role-grid"><section class="panel"><h2>${esc(p.name)}</h2><div class="scene-state">${esc(p.objects)}</div><h3>① ${p.first}先說</h3><p class="task">「${esc(p.opening)}」</p><p class="fine">請用自己的英文表達，不必逐字翻譯。</p><h3>② 接著怎麼做</h3><p>${esc(p.next)}</p><div class="section-title"><h3>這次要完成的事</h3><span id="pairProgress">${state.checks[p.id].filter(Boolean).length} / ${p.goals.length} 項已做到</span></div>${p.goals.map((g,i)=>check(`data-pair-check="${p.id}:${i}"`,g,state.checks[p.id][i])).join('')}<p class="fine">完成目標：把以上溝通需求說清楚。老師依實際表達勾選，也能取消。</p>${field('note-'+p.id,'記下一句真正用到的英文')}</section><details class="teacher"><summary>老師引導（共看，非私密）</summary><h3>先確認起點</h3><p>${p.first}先說：「${esc(p.opening)}」</p>${p.start?`<p class="en" lang="en">${esc(p.start)}</p>${audio(p.start)}`:'<p>先等待學生開口。</p>'}<p class="hint">${esc(p.tags)}</p><h3>聽到學生……你可以接</h3><p class="fine">找符合當下的一張，不必逐卡照念。</p>${p.cards.map(([trigger,line,zh])=>`<div class="teacher-card"><b>${esc(trigger)} →</b><p class="en" lang="en">${esc(line)}</p><p>${esc(zh)}</p>${audio(line)}</div>`).join('')}<details><summary>學生卡住了</summary><p>先問：「現在想讓對方知道什麼？」接受單字或短句，再用關鍵字協助。</p>${hint(p.words,p.answer)}</details><details><summary>帶領小提醒與完整條件</summary><p>${esc(p.tags)}。回應以學生實際說法為準，已說清楚的資訊不必重問。請留空間讓學生先開口，短答能傳達正確資訊，就可以繼續接話。</p></details></details></div>`;}
const ratingNames=['尚未自評','看完整範例','看關鍵字','能獨立完成'];
function legacyView(){if(!state.legacy)return '';const labels={before:'課前回答',after:'舊版課後題回答',drafts:'情境回答',followups:'追問',closing:'結尾',pairReplies:'雙人練習',homeAnswer:'課後口說',ratings:'舊版自評',home:'舊版練習勾選'};return '<details class="panel"><summary>改版前的練習紀錄</summary><p>舊版課後題與新題不同，保留在這裡供回顧，不當成本次同題作答。</p>'+Object.entries(labels).filter(([k])=>state.legacy[k]!==undefined).map(([k,label])=>'<h3>'+label+'</h3><div class="readonly">'+esc(Array.isArray(state.legacy[k])?state.legacy[k].map((v,i)=>(i+1)+'. '+String(v)).join('\n'):String(state.legacy[k]))+'</div>').join('')+'</details>';}
function progressPage(){return head('', '回到同一道題，看見自己現在能說清楚的事。')+legacyView()+`<section class="panel"><h2>回到同一題</h2><p class="task">${esc(course.task)}</p>${hint(course.words,course.answer)}<div class="grid"><div><h3>第一次的我</h3><div class="readonly">${state.answers.before?esc(state.answers.before):'尚無課前紀錄。可以回第一部分留下自己的嘗試。'}</div></div><div>${field('after','現在的我')}</div></div><p class="hint">一起核對：${esc(course.review)}</p></section><section class="panel"><h2>現在的我，能做到哪一步？</h2><p>選這次實際需要的協助；看過提示不會自動替你評級。</p>${course.skills.map(s=>{const r=state.ratings[s.id];return `<div class="rating" data-level="${r}"><h3>${esc(s.text)}</h3><div class="meter" aria-label="${ratingNames[r]}${r?'，'+r+' / 3 格':''}">${[1,2,3].map(n=>`<span class="${r>=n?(r===3?'green':'yellow'):''}"></span>`).join('')}</div><p>${ratingNames[r]}${r?' · '+r+' / 3 格':''}</p><div class="actions">${[1,2,3].map(n=>btn(`${ratingNames[n]}<small>${['','有完整句子，我能跟著表達。','給我幾個詞，我能自己組句。','不看提示，我也能說清楚。'][n]}</small>`,`data-rating="${s.id}:${n}"`,`aria-pressed="${r===n}"`)).join('')}</div></div>`;}).join('')}</section><section class="panel"><h2>留下一句具體回饋。</h2><p>老師與學生一起找出：這次做到了什麼，下次要多練習哪一步。</p></section>`;}
function homePage(){return head('', '先聽懂，再說自己的版本。答錯可以重選，沒有次數限制。')+`<div class="grid"><section class="panel"><h2>1. 聽懂關鍵資訊</h2>${quizzes.map((q,i)=>`<section style="margin:24px 0"><h3>${i+1}. ${esc(q.task)}</h3>${audio(q.line)}${transcript(q.line,q.zh)}<div class="actions">${q.options.map((o,j)=>btn(esc(o),`data-quiz="${q.id}:${j}"`,`aria-pressed="${quizChoices[q.id]===j}"`)).join('')}</div><div role="status">${quizChoices[q.id]!==undefined?`<p class="feedback ${quizChoices[q.id]===q.correct?'':'retry'}">${quizChoices[q.id]===q.correct?'✓ '+esc(q.why):'再聽一次，留意題目要求的資訊；也可以打開逐字稿再選。'}</p>`:''}</div></section>`).join('')}${check('data-home="listen"','我已練習聽懂關鍵資訊',state.home.listen)}</section><section class="panel"><h2>2. 說自己的版本</h2><p class="task">${esc(homeTask)}</p>${field('home','我的旅遊英文')}${hint(homeWords,homeAnswer)}${check('data-home="written"','我已寫下自己的版本',state.home.written)}${check('data-home="spoken"','我已收起提示，大聲說一次',state.home.spoken)}<p id="homeProgress" class="status">${homeProgress()}</p><p class="fine">勾選表示你已練習，不是自動評分。</p></section></div>`;}
function homeProgress(){const n=Object.values(state.home).filter(Boolean).length;return `已練習 ${n} / ${Object.keys(state.home).length} 項${n===Object.keys(state.home).length?' · 課後挑戰完成 ✓':''}`;}
function render(){const views=[intro,phrasePage,scenePage,missionPage,pairPage,progressPage,homePage];$('#main').innerHTML=views[page]()+`<div class="footer-actions">${btn('← 上一部分',`data-page="${page-1}"`,page===0?'disabled':'')}${btn(page===6?'回到課前首頁':'下一部分 →',`data-page="${page===6?0:page+1}"`)}</div>`;$('#nav').innerHTML=course.labels.map((t,i)=>btn(`<span class="number">${String(i+1).padStart(2,'0')}</span>${esc(t)}`,`data-page="${i}"`,i===page?'aria-current="step"':'')).join('');showStorage();}
function focusMain(){ $('#main').focus({preventScroll:true}); }
// A tablet's stacked scene can be several screens tall. Keep the next turn
// visible after leaving the object controls, including back and completion.
function focusSceneStep(){
 focusMain();
 const target=$('.flow-turn.turn-current')||$('#main > .panel');
 if(!target)return;
 const top=target.getBoundingClientRect().top;
 const inset=($('.top')?.getBoundingClientRect().bottom||0)+16;
 if(top<inset||top>innerHeight-120)window.scrollTo({top:Math.max(0,window.scrollY+top-inset),behavior:'instant'});
}
function navigate(p){if(!Number.isInteger(p)||p<0||p>=course.labels.length)return;stopAudio();page=p;render();if(window.matchMedia('(max-width:1100px)').matches)$('#courseMenu').open=false;focusMain();const title=$('#main h1')||$('#main');const inset=($('.top')?.getBoundingClientRect().height||0)+16;window.scrollTo({top:Math.max(0,window.scrollY+title.getBoundingClientRect().top-inset),behavior:'instant'});}
function resetTurn(){heard=false;spoken=false;choice=-1;feedback='';}
function start(i){if(!flows[i])return;flow=i;turn=0;history=[];finished=false;resetTurn();navigate(2);}
function choose(i){const t=currentStep();if(finished||!heard||!spoken||!Number.isInteger(i)||!t.objects[i])return;choice=i;history=history.slice(0,turn);if(accepted(t,i)){history[turn]=i;feedback=t.effect;}else feedback='再試一次：這個操作不符合目前的需要。重看中文任務，或重聽對方的話。';render();$(`[data-choice="${i}"]`).focus({preventScroll:true});}
function next(){if(!canNext())return;stopAudio();if(turn===flows[flow].steps.length-1){finished=true;if(!state.complete.includes(flows[flow].id))state.complete.push(flows[flow].id);save();}else{turn++;resetTurn();}render();focusSceneStep();}
function back(){if(turn===0||finished)return;stopAudio();turn--;history=history.slice(0,turn);resetTurn();render();focusSceneStep();}
function appearance(){const dark=document.documentElement.dataset.theme==='dark',large=document.documentElement.dataset.size==='large';$('#theme').textContent=dark?'☀ 淺色':'☾ 深色';$('#theme').setAttribute('aria-label',dark?'切換為淺色模式':'切換為深色模式');$('#theme').setAttribute('aria-pressed',String(dark));$('#large').textContent=large?'標準文字':'放大文字';$('#large').setAttribute('aria-pressed',String(large));}
document.addEventListener('input',e=>{const key=e.target.dataset.field;if(fields.includes(key)){state.answers[key]=e.target.value;save();}});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.pairCheck){const [id,i]=d.pairCheck.split(':'),p=pairs.find(p=>p.id===id);if(!p||!p.goals[+i])return;state.checks[id][+i]=e.target.checked;save();$('#pairProgress').textContent=`${state.checks[id].filter(Boolean).length} / ${p.goals.length} 項已做到`;return;}if(d.home&&Object.hasOwn(state.home,d.home)){state.home[d.home]=e.target.checked;save();$('#homeProgress').textContent=homeProgress();return;}if(['heard','spoken'].includes(e.target.id)){const id=e.target.id;if(currentStep().askFirst){if(id==='spoken')spoken=e.target.checked;else heard=spoken&&e.target.checked;if(!spoken)heard=false;}else{if(id==='heard')heard=e.target.checked;else spoken=heard&&e.target.checked;if(!heard)spoken=false;}choice=-1;feedback='';history=history.slice(0,turn);render();$('#'+id).focus({preventScroll:true});}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.say)return speak(d.say,d.slow==='true');if(d.page!==undefined)return navigate(+d.page);if(d.start!==undefined)return start(+d.start);if(d.choice!==undefined)return choose(+d.choice);if(d.act==='next')return next();if(d.act==='back')return back();if(d.mode&&['library','reply'].includes(d.mode)){stopAudio();mode=d.mode;render();($(`[data-mode="${mode}"]`)||$("#main")).focus({preventScroll:true});return;}for(const key of ['reply','mission','pair'])if(d[key]!==undefined){const n=+d[key],list={reply:replies,mission:missions,pair:pairs}[key];if(!Number.isInteger(n)||!list[n])return;stopAudio();if(key==='reply')reply=n;if(key==='mission')mission=n;if(key==='pair')pair=n;render();$(`[data-${key}="${n}"]`).focus({preventScroll:true});return;}if(d.rating){const [id,n]=d.rating.split(':');if(!course.skills.some(s=>s.id===id)||![1,2,3].includes(+n))return;state.ratings[id]=+n;save();render();$(`[data-rating="${d.rating}"]`).focus({preventScroll:true});return;}if(d.quiz){const [id,n]=d.quiz.split(':'),q=quizzes.find(q=>q.id===id);if(!q||!q.options[+n])return;quizChoices[id]=+n;render();$(`[data-quiz="${d.quiz}"]`).focus({preventScroll:true});return;}if(b.id==='theme'||b.id==='large'){const theme=b.id==='theme',key=theme?'theme':'size',active=theme?'dark':'large',other=theme?'light':'standard';document.documentElement.dataset[key]=document.documentElement.dataset[key]===active?other:active;appearance();try{localStorage.setItem(theme?'travel-lab-theme':'travel-lab-text-size',document.documentElement.dataset[key]);}catch{toast('目前無法保存外觀設定，但本次切換仍有效。');}}});
window.addEventListener('pagehide',stopAudio);

const compact=window.matchMedia('(max-width:1100px)');
const menuSync=()=>{$('#courseMenu').open=!compact.matches;};menuSync();compact.addEventListener('change',menuSync);

// Part 3 uses the same numbered roles and turn guidance in every lesson.
function flowRoleHeader(me,title,subtitle,step){
 return `<div class="role-heading"><span class="turn-number" aria-label="第 ${step} 步">${step}</span><div><p class="role-label">${me?'我・旅客':esc(course.replyRole)}</p><h3>${esc(title)}</h3><p class="fine">${esc(subtitle)}</p></div></div>`;
}
function guidedFlowTurns(t,readingHtml='',header=flowRoleHeader){
 const locked=t.askFirst&&!spoken,selfLocked=!t.askFirst&&!heard;
 const selfFirst=(course.day===1||typeof microVersion==='number')&&t.askFirst;
 const turnClass=(waiting,done)=>` flow-turn turn-${waiting?'waiting':done?'done':'current'}`;
 const turnStatus=(waiting,done,me)=>`<p class="turn-status">${waiting?'等待中 · 請先完成第 1 步':done?'✓ 已完成此步':me?'現在輪到你 · 說完再勾選':'現在聽對方 · 聽完或讀完再勾選'}</p>`;
 const speaker=`<section class="role-frame role-other${turnClass(locked,heard)}" aria-label="${esc(course.replyRole)}會說的話">${header(false,`${t.askFirst?'回覆你':'先聽'} · ${course.replyRole}會說的話`,'聽懂這次需要的資訊即可。',t.askFirst?2:1)}${turnStatus(locked,heard,false)}${locked?`<p class="listen-locked">先完成${selfFirst?'上方':'下方'}的開口並勾選，再播放對方回覆。需要時，可自行展開台詞與中文。</p>`:audio(t.line)}${flowTranscript(t.line,t.zh,readingHtml)}${check('id="heard"',locked?`尚未輪到 · 先完成${selfFirst?'上方':'下方'}的開口確認`:'我已聽完，或已讀完逐字稿',heard,locked)}</section>`;
 const self=`<section class="role-frame role-self${turnClass(selfLocked,spoken)}" aria-label="我需要說的話">${header(true,t.askFirst?'我先開口':'換我回答','↓ 看這裡，換你說',t.askFirst?1:2)}${turnStatus(selfLocked,spoken,true)}<div class="speaking-task"><p class="task">${esc(t.task)}</p>${hint(t.words,t.answer)}</div>${check('id="spoken"',selfLocked?'尚未輪到 · 先完成上方的聽讀確認':'我已用自己的聲音說',spoken,selfLocked)}</section>`;
 if(selfFirst)return `${self}<div class="dialogue-link" aria-hidden="true">↓ 說完以後，聽對方回覆</div>${speaker}`;
 return `${speaker}<div class="dialogue-link" aria-hidden="true">${t.askFirst?'↑ 先從下方開口，再聽回覆':'↓ 聽過以後，換我說'}</div>${self}`;
}


// Shared by Days 0 and 2. Keep the original lesson engine's input, retry and save behavior.
let taskRound=0,roundsDone=[],listenPractice=true,probeChoice=-1,routeVariant=0;
const roundKey=course.id+'-rounds';
try{const s=JSON.parse(localStorage.getItem(roundKey)||'{}');if(Number.isInteger(s.round)&&rounds[s.round])taskRound=s.round;if(Array.isArray(s.done))roundsDone=rounds.map(r=>r.id).filter(id=>s.done.includes(id));}catch{}
const activeRound=()=>rounds[taskRound];
const persistRound=()=>{try{const saved=JSON.parse(localStorage.getItem(roundKey)||'{}');localStorage.setItem(roundKey,JSON.stringify({...saved,round:taskRound,done:roundsDone}));}catch{storageFailed=true;showStorage();}};
function setTaskRound(n){if(!Number.isInteger(n)||!rounds[n])return;stopAudio();taskRound=n;flow=rounds[n].flowIds[0];mission=rounds[n].missionIds[0];pair=rounds[n].pairIds[0];reply=rounds[n].replyIds[0];turn=0;history=[];finished=false;routeVariant=0;mode='library';listenPractice=true;probeChoice=-1;resetTurn();}
setTaskRound(taskRound);
const roundTabs=tabs;
tabs=function(items,key,current){const ids={start:activeRound().flowIds,mission:activeRound().missionIds,pair:activeRound().pairIds}[key];return ids?`<div class="tabs" aria-label="本輪情境">${ids.map(i=>btn(esc(items[i].name),`data-${key}="${i}"`,`aria-pressed="${i===current}"`)).join('')}</div>`:roundTabs(items,key,current);};
const startTask=start;
start=function(i){const n=rounds.findIndex(r=>r.flowIds.includes(i));if(n<0)return;if(n!==taskRound){setTaskRound(n);persistRound();}startTask(i);};
function roleAvatar(me=false){
 const clerk=/店員|飯店|服務|售票/.test(course.replyRole);

function currentRoute(f){const base=f.side||'left';return routeVariant?(base==='left'?'right':'left'):base;}
lessonStep=function(f,index,get){const t={...f.steps[index]};
 if(language==='ja'){
  const side=currentRoute(f),line=side==='left'?'左に曲がってください。':'右に曲がってください。',zh=side==='left'?'左':'右';
  if(t.id==='ask'&&f.id==='round-b'){t.line='まっすぐ行ってください。'+line;t.zh='請直走，再'+zh+'轉。';}
  else if(t.id==='ask'||t.id==='repair'){t.line=line;t.zh='請'+zh+'轉。';t.valid=[side==='left'?0:1];}
  if(t.id==='walk'){const minutes=routeVariant?5:10;t.line=minutes===5?'はい。歩いて五分です。':'はい。歩いて十分です。';t.zh='可以，走路 '+minutes+' 分鐘。';t.valid=[minutes===5?0:1];}
 }else if(f.id==='round-c'&&t.id==='payment'&&get('alternative')===2){t.line='No problem. Thank you!';t.zh='沒問題，謝謝你！';t.task='你已決定不買，謝謝店員並離開。';t.words='thank you';t.answer='Thank you.';t.objects=[['↗','謝謝店員，離開']];t.valid=[0];t.askFirst=false;}
 return t;
};

scenePage=function(){const f=flows[flow],t=currentStep();if(finished)return head('','收起提示，把剛才完成的事再說一次。')+`<section class="panel"><h2>${esc(f.name)}：流程完成</h2>${sceneState()}<p class="task">${esc(f.summary)}</p><div class="actions">${btn('再練一次',`data-start="${flow}"`)}${language==='ja'?btn('換方向，再問一次','data-route-variant="toggle"'):''}${btn('進入本輪情境變化 →','data-page="3"')}</div></section>`;

// Read-only rehearsal: derive the actual speaker order from the authored steps.
// It shares the existing audio controls and does not change learning records.
function dialoguePreview({steps,role,task,title='對話怎麼接？先照順序看一遍',className='micro-example',prelude,kind='primary'}){
 const lang=typeof language==='string'?language:'en';
 let number=0;
 const turn=(speaker,text,zh,speakerRole=role)=>{
  const n=++number,who=speaker==='self'?'我 · 旅客':speakerRole;
  return `<li class="micro-turn" data-speaker="${speaker}"><div class="micro-turn-label"><span class="micro-turn-number">${n}</span><strong>${esc(who)}</strong></div><p class="en" lang="${lang}">${esc(text)}</p><p class="micro-turn-meaning">${esc(zh)}</p>${lang!=='en'&&typeof reading==='function'?reading(text):''}${audio(text)}</li>`;
 };
 let opening='';
 if(prelude){
  opening=`<div class="micro-dialogue micro-prelude"><ol class="micro-turns">${turn('other',prelude.line,prelude.zh)}<li class="micro-turn micro-turn-action" data-speaker="action"><div class="micro-turn-label"><span class="micro-turn-number">${++number}</span><strong>我 · 指出目的地</strong></div><p>${esc(prelude.task)}</p></li></ol></div>`;
 }
 const dialogue=steps.map((s,i)=>{
  const start=number+1;
  const self=()=>turn('self',s.answer,s.answerZh),other=()=>turn('other',s.line,s.zh,s.role||role);
  const scene=s.sceneTitle||s.sceneContext?`<header class="dialogue-scene"><h3>${esc(s.sceneTitle||'接著練習')}</h3>${s.sceneContext?`<p>${esc(s.sceneContext)}</p>`:''}${s.role?`<p class="fine">我與${esc(s.role)}接話</p>`:''}</header>`:'';
  return `${scene}<div class="micro-dialogue" data-exchange="${i}"${s.sourceTaskId?` data-source-task="${esc(s.sourceTaskId)}"`:''}><ol class="micro-turns" start="${start}">${s.askFirst?self()+other():other()+self()}</ol></div>`;
 }).join('');
 return `<section class="panel dialogue-preview ${className}" data-example-kind="${kind}"><p class="eyebrow">本輪對話示範 · 按順序接話</p><h2>${esc(title)}</h2><p class="micro-example-context">${esc(task)}</p>${opening}${dialogue}<p class="fine">先照順序讀一遍，再和老師分角色練。每次只練這個情境；熟悉後收起範例，用自己的聲音說。</p></section>`;
}

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
 if(d.beforeRound!==undefined){setTaskRound(+d.beforeRound);navigate(0);}
 if(d.repeatRound!==undefined){setTaskRound(+d.repeatRound);navigate(1);}
 if(d.closeRound){reviewMode='current';persistMicro();navigate(5);}
 if(d.reviewMode){
  stopAudio();
  if(d.reviewMode==='mixed'&&roundsDone.length>=2){reviewMode='mixed';if(reviewIds.length<2)reviewIds=[...roundsDone];}
  else reviewMode='current';
  persistMicro();render();$(`[data-review-mode="${reviewMode}"]`).focus({preventScroll:true});
 }
 if(d.taskQuiz){
  const [id,n]=d.taskQuiz.split(':'),r=rounds.find(r=>r.id===id);
  if(!r||!r.home.quiz.options[+n])return;
  quizChoices[r.home.quiz.id]=+n;render();$(`[data-task-quiz="${d.taskQuiz}"]`).focus({preventScroll:true});
 }
});
document.addEventListener('change',e=>{
 const d=e.target.dataset;
 if(d.roundReady){
  if(!rounds.some(r=>r.id===d.roundReady))return;
  roundsDone=rounds.map(r=>r.id).filter(id=>id===d.roundReady?e.target.checked:roundsDone.includes(id));
  reviewIds=reviewIds.filter(id=>roundsDone.includes(id));
  if(reviewMode==='mixed'&&reviewIds.length<2)reviewMode='current';
  persistMicro();render();($(`[data-round-ready="${d.roundReady}"]`)||$('#main')).focus({preventScroll:true});
 }
 if(d.reviewRound){
  if(!roundsDone.includes(d.reviewRound))return;
  if(!e.target.checked&&reviewIds.length<=2){e.target.checked=true;toast('混合複習至少保留兩輪；只練一輪請選「只看本輪」。');return;}
  reviewIds=roundsDone.filter(id=>id===d.reviewRound?e.target.checked:reviewIds.includes(id));
  stopAudio();persistMicro();render();$(`[data-review-round="${d.reviewRound}"]`).focus({preventScroll:true});
 }
 if(d.taskHome){

 }
});

function dgStudyChangedPhrases(r){

 const changes=[];
 for(const variation of [r.variation,...r.additionalVariations||[]]){
  for(const step of variation?.steps||[]){
   if(taught.has(step.answer))continue;
   taught.add(step.answer);changes.push(step);
  }
 }
 if(!changes.length)return '';
 return `<section class="study-block dg-study-changes" aria-label="後面會用到的替換說法"><h2>換這個條件，再說一次</h2><p class="fine">④ 會用到下面的說法；先練改變的這一句，其餘沿用上面學過的句子。</p><div class="grid">${changes.map((s,i)=>`<article class="panel dg-change-card" data-study-change="${i}"><p class="eyebrow">${esc(s.label||'換一個條件')}</p><p>${esc(s.task)}</p><p class="en" lang="en">${esc(s.answer)}</p><p class="study-meaning">${esc(s.answerZh)}</p>${audio(s.answer)}</article>`).join('')}</div></section>`;
}
function dgStudyHearLines(r){
 const lines=[...r.hearLines],known=new Set(lines.map(p=>p.en));
 for(const variation of [r.variation,...r.additionalVariations||[]]){
  for(const step of variation?.steps||[]){
   if(known.has(step.line))continue;
   known.add(step.line);lines.push({en:step.line,zh:step.zh,role:step.role||r.role,sources:['④ 換條件時會聽到']});
  }
 }
 return lines;
}

 #travel-app-views iframe[data-active]{visibility:visible;pointer-events:auto}
 #travel-app-status{position:fixed;z-index:3000;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);max-height:calc(100dvh - 40px);overflow:auto;padding:12px 16px;border:1px solid var(--line,#d9c4ac);border-radius:16px;background:var(--panel,#fff7ed);color:var(--ink,#382c22);box-shadow:0 4px 20px #0002;font:16px/1.5 system-ui}
 #travel-app-status[hidden]{display:none}
 #travel-app-status button,#travel-app-status a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin:4px;padding:8px 14px;border:1px solid currentColor;border-radius:10px;background:transparent;color:inherit;font:inherit;cursor:pointer}
 #travel-app-status p{margin:0 0 4px}
 `;
 document.head.append(style);
 for(const child of document.body.children)child.setAttribute('data-travel-original','');
 const host=document.createElement('div');host.id='travel-app-views';document.body.append(host);
 const status=document.createElement('div');status.id='travel-app-status';status.hidden=true;
 const message=document.createElement('p');message.role='status';message.setAttribute('aria-live','polite');status.append(message);
 const retry=document.createElement('button');retry.type='button';retry.textContent='重試';
 const direct=document.createElement('a');direct.textContent='直接開啟';
 const cancel=document.createElement('button');cancel.type='button';cancel.textContent='留在這一課';
 status.append(retry,direct,cancel);document.body.append(status);
 const initial={url:ownURL,win:window,title:document.title,scroll:0,used:0};
 const views=new Map([[ownURL,initial]]),sources=new Map(),requests=new Map();
 let current=initial,serial=0,tick=0,statusTimer,idleTimer,pending=null;
 let preference={theme:document.documentElement.dataset.theme,size:document.documentElement.dataset.size};
 window.history.scrollRestoration='manual';
 const initialAddress=location.href;
 window.history.replaceState({travelApp:true},'',initialAddress);
 function showStatus(text,failed=false){
  message.textContent=text;retry.hidden=direct.hidden=!failed;status.hidden=false;
 }
 function clearStatus(){clearTimeout(statusTimer);status.hidden=true;}
 function stop(view){view.win.stopAudio?.();}
 function applyAppearance(view){
  view.win.dispatchEvent(new view.win.CustomEvent('travel-appearance-apply',{detail:preference}));
 }
 function appearance(win){
  preference={theme:win.document.documentElement.dataset.theme,size:win.document.documentElement.dataset.size};
  for(const view of views.values())if(view.win!==win)applyAppearance(view);
 }
 function prefetch(url){
  if(views.has(url)||sources.has(url))return Promise.resolve(sources.get(url));
  if(requests.has(url))return requests.get(url);
  const abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),15000);
  const request=fetch(url,{signal:abort.signal,credentials:'same-origin'}).then(async response=>{
   if(!response.ok||!response.headers.get('content-type')?.includes('text/html'))throw Error('Lesson unavailable');
   const html=await response.text();
   if(!html.includes('id="travel-app-navigation"'))throw Error('Lesson version unavailable');
   sources.set(url,html);
   while(sources.size>5)sources.delete(sources.keys().next().value);
   return html;
  }).finally(()=>{clearTimeout(timeout);requests.delete(url);});
  requests.set(url,request);
  // Speculative requests must never produce an unhandled rejection.
  request.catch(()=>{});return request;
 }
 function scheduleNext(){
  clearTimeout(idleTimer);
  if(navigator.connection?.saveData)return;
  idleTimer=setTimeout(()=>{
   const doc=current.win.document,links=[...doc.querySelectorAll('.day-switcher a[href]')];
   const index=links.findIndex(a=>route(a.href)===current.url);
   const next=links[index+1]||doc.querySelector('main a[href*="travel-"]');
   if(next){const url=route(next.href);if(url&&url!==current.url)prefetch(url);}
  },1000);
 }
 async function prepare(url,token){
  if(views.has(url))return views.get(url);
  const html=await prefetch(url);
  if(token!==serial)return null;
  const parsed=new DOMParser().parseFromString(html,'text/html');
  if(!parsed.querySelector('main'))throw Error('Lesson incomplete');
  const baseTag=document.createElement('base');baseTag.href=url;baseTag.target='_top';
  parsed.head.prepend(baseTag);
  const frame=document.createElement('iframe');frame.setAttribute('data-travel-view','');
  frame.title=parsed.title;frame.setAttribute('aria-hidden','true');frame.tabIndex=-1;
  // No iframe URL navigation: fetched documents are committed only when ready.
  const view={url,title:parsed.title,frame,win:null,scroll:0,used:++tick};
  await new Promise((resolve,reject)=>{
   const timeout=setTimeout(()=>{frame.remove();reject(Error('Lesson preparation timed out'));},15000);
   frame.onload=()=>{
    if(!frame.contentDocument?.querySelector('#travel-app-navigation'))return;
    clearTimeout(timeout);frame.onload=null;
    if(!frame.contentDocument.querySelector('main')?.children.length){frame.remove();reject(Error('Lesson did not render'));return;}
    view.win=frame.contentWindow;resolve();
   };
   frame.srcdoc='<!doctype html>'+parsed.documentElement.outerHTML;host.append(frame);
  });
  if(token!==serial){frame.remove();return null;}
  views.set(url,view);return view;
 }
 function prune(){
  // Keep the initial document plus the two most recently used lesson frames.
  for(const view of [...views.values()].filter(v=>v!==initial&&v!==current).sort((a,b)=>a.used-b.used)){
   if(views.size<=3)break;
   view.frame.remove();views.delete(view.url);
  }
 }
 function commit(view,{pop=false,hash=''}={}){
  current.scroll=current.win.scrollY;
  stop(current);
  current.win.document.querySelectorAll('dialog[open]').forEach(dialog=>dialog.close());
  if(current.frame){current.frame.removeAttribute('data-active');current.frame.setAttribute('aria-hidden','true');current.frame.tabIndex=-1;}
  current=view;current.used=++tick;applyAppearance(view);
  document.documentElement.classList.toggle('travel-app-framed',view!==initial);
  if(view.frame){view.frame.setAttribute('data-active','');view.frame.removeAttribute('aria-hidden');view.frame.removeAttribute('tabindex');}
  document.title=view.title;
  if(!pop)window.history.pushState({travelApp:true},'',view.url+hash);
  view.win.scrollTo({top:view.scroll,behavior:'instant'});
  const main=view.win.document.querySelector('main');
  if(main){main.setAttribute('tabindex','-1');main.focus({preventScroll:true});}
  if(hash){try{view.win.document.getElementById(decodeURIComponent(hash.slice(1)))?.scrollIntoView();}catch{}}
  prune();scheduleNext();
 }
 async function open(url,options={}){
  url=route(url);if(!url)return;
  const token=++serial;clearStatus();clearTimeout(idleTimer);pending={url,options};
  if(url===current.url){pending=null;scheduleNext();return;}
  stop(current);
  retry.onclick=()=>open(url,options);
  direct.href=url;direct.target='_top';
  statusTimer=setTimeout(()=>showStatus('正在準備課程，原課程仍可操作。'),650);
  try{
   const view=await prepare(url,token);
   if(token!==serial||!view)return;
   clearStatus();pending=null;commit(view,options);
  }catch(error){
   if(token!==serial)return;
   clearStatus();
   if(options.pop)window.history.replaceState({travelApp:true},'',current.url);
   // Retrying after a failed Back action must restore a matching URL as well.
   retry.onclick=()=>open(url,{hash:options.hash});
   showStatus('暫時無法開啟這一課。你的原課程和作答仍保留，可以重試。',true);
  }
 }
 cancel.onclick=()=>{
  ++serial;clearStatus();
  if(pending?.options.pop)window.history.replaceState({travelApp:true},'',current.url);
  pending=null;scheduleNext();
 };
 window.travelApp={open,prefetch,appearance};
 wire(window.travelApp);
 window.addEventListener('popstate',()=>{
  const url=route(location.href);
  if(url)open(url,{pop:true,hash:location.hash});
 });
 window.addEventListener('pagehide',()=>stop(current));
 scheduleNext();
})();
