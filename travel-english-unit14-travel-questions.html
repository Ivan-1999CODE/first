function save(){try{localStorage.setItem(course.id,JSON.stringify(state));}catch{storageFailed=true;showStorage();}}
function showStorage(){const n=$('#storageNotice');n.hidden=!storageFailed;if(storageFailed)n.textContent='此瀏覽器目前無法讀取或保存紀錄；你仍可練習，但關閉後可能不保留本次作答。';}
let page=0,mode='library',reply=0,mission=0,pair=0,flow=0,turn=0,history=[],heard=false,spoken=false,choice=-1,feedback='',finished=false;
let quizChoices={},toastTimer;
function stopAudio(){if(window.speechSynthesis)window.speechSynthesis.cancel();}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,5500);}
function speak(text,slow=false){stopAudio();if(!window.speechSynthesis||!window.SpeechSynthesisUtterance){toast('此瀏覽器無法朗讀；請展開英文與中文，讀完後照樣能練習。');return;}try{const u=new window.SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=slow?.72:.94;u.onerror=()=>toast('朗讀未能播放；請展開英文與中文繼續。');window.speechSynthesis.speak(u);}catch{toast('朗讀未能播放；請展開英文與中文繼續。');}}

const audio=en=>`<div class="actions">${btn('▶ 聽英文',`data-say="${esc(en)}"`)}${btn('慢速',`data-say="${esc(en)}" data-slow="true"`)}</div>`;
const transcript=(en,zh)=>`<details><summary>對方英文與中文</summary><p class="en" lang="en">${esc(en)}</p><p>${esc(zh)}</p></details>`;
const hint=(words,answer)=>`<details><summary>需要一點關鍵字</summary><p class="hint" lang="en">${esc(words)}</p><details><summary>完整參考說法</summary><p class="en" lang="en">${esc(answer)}</p>${audio(answer)}<p class="fine">這是一種可用的說法，不必逐字相同。</p></details></details>`;

function intro(){return `<section class="hero home-hero"><div class="hero-copy"><p class="eyebrow">DAY 14 / ASK & EXPLORE</p><h1>問清楚，<br>讓旅程<span>有方向。</span></h1><p class="lead muted">在哪集合？什麼時候出發？誰帶隊？<br>用三種問法，拼出下一段旅程。</p><p class="fine">第 14 天 · Where / When / Who</p></div>${heroArt()}</section><section class="panel before-panel"><p class="eyebrow">FIRST TRY / 留下起點</p><h2>先試著說，不急著找答案。</h2><p class="task">${esc(course.task)}</p>${field('before','第一次的提問')}<p class="fine">單字或短句也可以。先留下原本說法，第六部分再比較。</p></section><div class="section-title home-section-title"><h2>兩趟任務，把資訊問完整</h2><span class="status progress-pill">${state.complete.length} / ${flows.length} 已練習</span></div><div class="cards home-journeys">${flows.map((f,i)=>`<section class="panel"><p class="eyebrow">${String(i+1).padStart(2,'0')} / ${i===0?'PLAN YOUR DAY':'CHECK THE CHANGE'} ${state.complete.includes(f.id)?'✓':''}</p><h3>${esc(f.name)}</h3><p class="muted">${esc(f.desc)}</p><div class="actions">${btn('進入情境 →',`data-start="${i}"`)}</div></section>`).join('')}</div><div class="actions home-actions">${btn('先學隨身句 →','data-page="1"','class="primary"')}</div><p class="fine">本課行程、時間、地點與人物皆為教學設定。</p>`;}
function supplements(){return [
 ['店家打烊','When do you close today?','We close at six.','問今天何時打烊。'],
 ['介紹來處','Where are you from?','I’m from Taiwan.','問來自哪裡，和 Where are you going? 問目的地不同。'],
 ['確認收件人','Who is the package for?','It’s for William.','問包裹要給誰。'],
 ['電話確認身分','Who is calling, please?','This is Amy.','接電話時詢問來電者；電話自我介紹可用 This is…。']
 ].map(([use,q,a,zh])=>`<div class="teacher-card"><h3>${esc(use)}</h3><p class="en" lang="en">${esc(q)}</p>${audio(q)}<details><summary>用法與參考短答</summary><p>${esc(zh)}</p><p class="en" lang="en">${esc(a)}</p>${audio(a)}</details></div>`).join('');}

function phrasePage(){let content='';if(mode==='library')content=`<div class="grid">${phrases.map((p,i)=>`<article class="panel"><div class="eyebrow">${String(i+1).padStart(2,'0')} / ${esc(p.use)}</div><p class="en" lang="en">${esc(p.en)}</p><details><summary>看中文意思</summary><p>${esc(p.zh)}</p></details>${audio(p.en)}</article>`).join('')}</div><section class="panel supplement"><h2>先認出問題要哪一種資訊</h2><div class="question-key"><p><b lang="en">WHERE</b><br>地點、目的地、來處</p><p><b lang="en">WHEN</b><br>時間、日期</p><p><b lang="en">WHO</b><br>人物、身分</p></div><p>短答也能完成溝通：<span lang="en">In the hotel lobby. / At nine. / Amy.</span> 先答對資訊，再練完整句。</p><details><summary>時間小提醒：When 與 What time</summary><p><span lang="en">When</span> 可以問日期或時間；要特別問幾點，也可以說 <span lang="en">What time do we leave?</span>。整點前用 <span lang="en">at</span>：<span lang="en">at nine</span>；<span lang="en">next Monday / tomorrow</span> 前不加 <span lang="en">at</span>。</p></details><details><summary>課本補充：商店、聊天、包裹與電話</summary>${supplements()}</details><details><summary>延伸再看：過去的時間與消息來源</summary><p class="en" lang="en">When did the café open?</p><p>這裡問咖啡廳何時開幕，例如 <span lang="en">Last month.</span>；問每天的營業時間則說 <span lang="en">What time does the café open?</span></p><p class="en" lang="en">When did you last try stinky tofu?</p><p>問上一次嘗試的時間，可短答 <span lang="en">Yesterday. / Two weeks ago.</span></p><p class="en" lang="en">Who told you that?</p><p>問是誰說的，可答 <span lang="en">My friend.</span> 如果其實是自己讀到的，也能澄清 <span lang="en">Actually, I read it in a book.</span>，不必硬答人名。</p></details></section>`;else{const r=replies[reply];content=`${tabs(replies,'reply',reply)}<section class="panel"><div class="section-title"><h2>${esc(r.name)}</h2><span>${reply+1} / ${replies.length}</span></div><div class="grid"><div><h3>對方問你</h3><div class="icon" aria-hidden="true">◉</div>${audio(r.line)}${transcript(r.line,r.zh)}</div><div><h3>換你回答</h3><p class="task">${esc(r.task)}</p>${hint(r.words,r.answer)}<h3>換成你的答案</h3><p>${esc(r.change)}</p>${hint(r.changeWords,r.changeAnswer)}</div></div><div class="footer-actions">${btn('上一組',`data-reply="${reply-1}"`,reply===0?'disabled':'')}${reply<replies.length-1?btn('下一組 →',`data-reply="${reply+1}"`):btn('進入互動流程 →','data-page="2"')}</div></section>`;}return head('', '先找自己想表達的意思，再練習接住對方的一句話。')+`<div class="modes">${btn(`我想怎麼說<small>${phrases.length} 句隨身英文</small>`,'data-mode="library"',`aria-pressed="${mode==='library'}"`)}${btn(`對方問，我來答<small>${replies.length} 組情境問答</small>`,'data-mode="reply"',`aria-pressed="${mode==='reply'}"`)}</div><p class="fine">直接開口練習即可；這裡不錄音，也不自動評分。</p>`+content;}
function selected(id){const n=flows[flow].steps.findIndex(t=>t.id===id);return history[n];}
function tour(){return tours[selected('destination')===1?1:0];}
function currentStep(){const f=flows[flow],t={...f.steps[turn]},d=tour();t.askFirst=t.id!=='destination';
 if(f.id==='tour'){
  if(t.id==='place'){t.line=`We meet ${d.placeEn}.`;t.zh=`我們在${d.place}集合。`;t.valid=[selected('destination')===1?1:0];}
  if(t.id==='time'){t.line=`We leave at ${d.timeEn} tomorrow morning.`;t.zh=`明天早上 ${d.time} 出發。`;t.valid=[selected('destination')===1?2:1];}
  if(t.id==='guide'){t.line=`${d.guide} is your guide.`;t.zh=`${d.guide} 是你的導遊。`;t.valid=[selected('destination')===1?1:0];}
  if(t.id==='back'){t.line=`We get back at ${d.backEn} in the afternoon.`;t.zh=`我們下午 ${d.back} 回來。`;t.valid=[selected('destination')===1?2:1];}
  if(t.id==='confirm'){t.line=`Yes, that's right. At ${d.timeEn}, ${d.placeEn}. ${d.guide} is your guide. See you tomorrow!`;t.zh=`對，明天 ${d.time}，在${d.place}。${d.guide} 是你的導遊。明天見！`;t.answer=`At ${d.timeEn}, ${d.placeEn}. ${d.guide} is our guide. Is that right?`;}
 }
 return t;
}
function itinerary(){const change=flows[flow].id==='change',d=tour();return {
 name:change?'海邊半日遊':selected('destination')===undefined?'尚未選擇':d.name,
 place:change?(selected('place')===2?'飯店旁的咖啡廳':'飯店大廳'):selected('place')===undefined?'待詢問':d.place,
 pin:change?(selected('place')===2?2:0):selected('place'),
 time:change?(selected('time')===2?'10:00':'09:00'):selected('time')===undefined?'待詢問':d.time,
 guide:change?(selected('guide')===1?'Ben':'Amy'):selected('guide')===undefined?'待詢問':d.guide,
 back:change?'本次只確認集合':selected('back')===undefined?'待詢問':d.back
 };}
function mapArt(pin){return `<svg class="tour-map" viewBox="0 0 420 185" role="img" aria-label="集合地圖，${pin===undefined?'尚未標記':['飯店大廳','博物館入口','飯店旁咖啡廳'][pin]}"><rect width="420" height="185" rx="14" fill="#e3edd7"/><path d="M0 134h420M142 0v185M286 0v185" stroke="#fffdf5" stroke-width="18"/><path d="M0 134h420" stroke="#b7bfb2" stroke-dasharray="8 8" fill="none"/>${[0,1,2].map((n)=>{const x=[42,330,190][n];return `<g transform="translate(${x} 54)"><path d="M0 15 25-6l25 21v43H0Z" fill="${n===0?'#639489':n===1?'#b39870':'#be8064'}"/><path d="M8 22h11v12H8m23-12h11v12H31" fill="#fff6d8"/><path d="M20 58V42h12v16" fill="#385e55"/>${pin===n?'<path d="M15-30a10 10 0 1 1 20 0c0 11-10 21-10 21s-10-10-10-21" fill="#175b51"/><circle cx="25" cy="-30" r="3" fill="white"/>':''}<text x="25" y="111" text-anchor="middle" font-size="13" fill="#31483f">${['飯店','博物館','咖啡廳'][n]}</text></g>`;}).join('')}</svg>`;}
function clockArt(time){const hour=time==='待詢問'?null:Number(time.split(':')[0]);return `<svg viewBox="0 0 100 100" class="clock-art" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="#fffdf4" stroke="#608277" stroke-width="3"/>${[0,1,2,3].map(n=>`<path d="M50 11v7" transform="rotate(${n*90} 50 50)" stroke="#608277" stroke-width="3"/>`).join('')}${hour===null?'<text x="50" y="63" text-anchor="middle" font-size="36" fill="#55766b">?</text>':`<path d="M50 50V24" transform="rotate(${hour*30} 50 50)" stroke="#256b5b" stroke-width="5" stroke-linecap="round"/><path d="M50 50V14" stroke="#b4854a" stroke-width="3" stroke-linecap="round"/>`}<circle cx="50" cy="50" r="4" fill="#256b5b"/></svg>`;}
function sceneView(){const d=itinerary();return {visual:'',text:`${d.name} · ${d.place} · ${d.time} · ${d.guide} · 回程：${d.back}`};}
function sceneState(){const d=itinerary();return `<div class="scene-state tour-card"><div class="ticket-title"><span>MY MEETING CARD</span><b>${finished?'✓ 已確認':'詢問中'}</b></div><h3>${esc(d.name)}</h3>${mapArt(d.pin)}<dl><div><dt>WHERE · 集合處</dt><dd>${esc(d.place)}</dd></div><div><dt>WHEN · 出發時間</dt><dd>${clockArt(d.time)}<strong>${esc(d.time)}</strong></dd></div><div><dt>WHO · 導遊</dt><dd><span class="guide-avatar" aria-hidden="true">${d.guide==='待詢問'?'?':d.guide[0]}</span>${esc(d.guide)}</dd></div>${flows[flow].id==='tour'?`<div><dt>WHEN · 回來時間</dt><dd>${esc(d.back)}</dd></div>`:''}</dl>${flows[flow].id==='change'?'<p class="fine">原卡：飯店大廳 · 09:00 · Amy<br>每確認一項，就更新上方卡片。</p>':''}</div>`;}
function objectArt(t,i){if(t.id==='time'||t.id==='back')return clockArt(t.objects[i][0]);if(t.id==='guide')return `<span class="guide-avatar" aria-hidden="true">${t.objects[i][0]}</span>`;return `<span class="object-icon" aria-hidden="true">${t.objects[i][0]}</span>`;}

function accepted(t,i){return Number.isInteger(i)&&t.valid.includes(i);}
function canNext(){return !finished&&heard&&spoken&&accepted(currentStep(),choice);}
function scenePage(){const f=flows[flow],t=currentStep();let content;
 const speakBlock=`<div class="speaking-heading"><h3>${t.askFirst?'① 先開口問':'② 換你回答'}</h3><span class="speaking-cue"><span aria-hidden="true">↓</span> 看這裡，換你說</span></div><div class="speaking-task"><p class="task">${esc(t.task)}</p>${hint(t.words,t.answer)}</div>${check('id="spoken"','我已用自己的聲音說',spoken,!t.askFirst&&!heard)}`;
 const listenBlock=`<h3>${t.askFirst?'② 聽對方回覆':'① 對方先問'}</h3>${t.askFirst&&!spoken?'<p class="hint">先試著說，再勾選上方確認，就能聽回覆或看逐字稿。</p>':`${audio(t.line)}${transcript(t.line,t.zh)}`}${check('id="heard"','我已聽完，或已讀完逐字稿',heard,t.askFirst&&!spoken)}`;
 if(finished)content=`<section class="panel"><p class="eyebrow">READY TO GO</p><h2>${esc(f.name)}：流程完成</h2>${sceneState()}<p class="task">收起提示，用英文告訴旅伴：在哪裡集合、幾點出發、誰是導遊。</p><p>✓ 完成標記會保留；重練可重新選行程。</p><div class="actions">${btn('再練一次',`data-start="${flow}"`)}${btn('換另一趟任務',`data-start="${(flow+1)%flows.length}"`)}${btn('換個情況說說看 →','data-page="3"')}</div></section>`;
 else content=`<section class="panel"><div class="section-title"><h2>${esc(f.name)}</h2>${btn('重新開始',`data-start="${flow}"`)}</div><p>${esc(f.context)}</p><p class="fine">問資訊時：先開口 → 聽回覆 → 更新卡片。勾選只是自我確認，不會錄音或辨識。</p><div class="scene-grid"><div><div class="eyebrow">第 ${turn+1} / ${f.steps.length} 步</div><div class="track">${f.steps.map((_,i)=>`<span class="${i<=turn?'done':''}"></span>`).join('')}</div>${t.askFirst?speakBlock+listenBlock:listenBlock+speakBlock}<div class="footer-actions">${btn('上一步','data-act="back"',turn===0?'disabled':'')}${btn(turn===f.steps.length-1?'完成流程 ✓':'下一步 →','data-act="next"',canNext()?'class="primary"':'disabled')}</div></div><div class="scene-board"><h3>③ 更新你的集合卡</h3>${sceneState()}<p class="fine">${heard&&spoken?'點選符合剛才回覆的物件。':'完成兩項確認後，就能操作下方物件。'}</p><div class="objects">${t.objects.map(([,label],i)=>btn(`${objectArt(t,i)}<small>${esc(label)}${choice===i?' · 已選':''}</small>`,`data-choice="${i}"`,`class="object" aria-pressed="${choice===i}" ${heard&&spoken?'':'disabled'}`)).join('')}</div><div id="flowFeedback" role="status">${feedback?`<p class="feedback ${accepted(t,choice)?'':'retry'}">${esc(feedback)}</p>`:''}</div></div></div></section>`;
 return head('','把問題問出口，聽懂資訊，再讓地圖、時間與名牌跟著更新。')+tabs(flows,'start',flow)+content;
}

function missionPage(){const m=missions[mission];return head('','先說，再記下自己的版本。不需要重走完整流程。')+tabs(missions,'mission',mission)+`<div class="grid"><section class="panel"><h2>${esc(m.name)}</h2><p class="task">${esc(m.task)}</p>${hint(m.words,m.answer)}</section><section class="panel">${field('mission-'+m.id,'我的說法')}<p class="hint">一起核對：${esc(m.check)}</p></section></div>`;}
function pairPage(){const p=pairs[pair];return head('', '師生共看同一個畫面，自然接話；目標不必依清單順序完成。')+tabs(pairs,'pair',pair)+`<p>${esc(p.role)}</p><div class="role-grid"><section class="panel"><h2>${esc(p.name)}</h2><div class="scene-state">${esc(p.objects)}</div><h3>① ${p.first}先說</h3><p class="task">「${esc(p.opening)}」</p><p class="fine">請用自己的英文表達，不必逐字翻譯。</p><h3>② 接著怎麼做</h3><p>${esc(p.next)}</p><div class="section-title"><h3>這次要完成的事</h3><span id="pairProgress">${state.checks[p.id].filter(Boolean).length} / ${p.goals.length} 項已做到</span></div>${p.goals.map((g,i)=>check(`data-pair-check="${p.id}:${i}"`,g,state.checks[p.id][i])).join('')}<p class="fine">完成目標：把以上溝通需求說清楚。老師依實際表達勾選，也能取消。</p>${field('note-'+p.id,'記下一句真正用到的英文')}</section><details class="teacher"><summary>老師引導（共看，非私密）</summary><h3>先確認起點</h3><p>${p.first}先說：「${esc(p.opening)}」</p>${p.start?`<p class="en" lang="en">${esc(p.start)}</p>${audio(p.start)}`:'<p>先等待學生開口。</p>'}<p class="hint">${esc(p.tags)}</p><h3>聽到學生……你可以接</h3><p class="fine">找符合當下的一張，不必逐卡照念。</p>${p.cards.map(([trigger,line,zh])=>`<div class="teacher-card"><b>${esc(trigger)} →</b><p class="en" lang="en">${esc(line)}</p><p>${esc(zh)}</p>${audio(line)}</div>`).join('')}<details><summary>學生卡住了</summary><p>先問：「現在想讓對方知道什麼？」接受單字或短句，再用關鍵字協助。</p>${hint(p.words,p.answer)}</details><details><summary>帶領小提醒與完整條件</summary><p>${esc(p.tags)}。回應以學生實際說法為準，已說清楚的資訊不必重問。請留空間讓學生先開口，短答能傳達正確資訊，就可以繼續接話。</p></details></details></div>`;}
const ratingNames=['尚未自評','看完整範例','看關鍵字','能獨立完成'];
function progressPage(){return head('', '回到同一道題，看見自己現在能說清楚的事。')+`<section class="panel"><h2>回到同一題</h2><p class="task">${esc(course.task)}</p>${hint(course.words,course.answer)}<div class="grid"><div><h3>第一次的我</h3><div class="readonly">${state.answers.before?esc(state.answers.before):'尚無課前紀錄。可以回第一部分留下自己的嘗試。'}</div></div><div>${field('after','現在的我')}</div></div><p class="hint">一起核對：有分別問到集合地點、出發時間與導遊身分嗎？</p></section><section class="panel"><h2>現在的我，能做到哪一步？</h2><p>選這次實際需要的協助；看過提示不會自動替你評級。</p>${course.skills.map(s=>{const r=state.ratings[s.id];return `<div class="rating" data-level="${r}"><h3>${esc(s.text)}</h3><div class="meter" aria-label="${ratingNames[r]}${r?'，'+r+' / 3 格':''}">${[1,2,3].map(n=>`<span class="${r>=n?(r===3?'green':'yellow'):''}"></span>`).join('')}</div><p>${ratingNames[r]}${r?' · '+r+' / 3 格':''}</p><div class="actions">${[1,2,3].map(n=>btn(`${ratingNames[n]}<small>${['','有完整句子，我能跟著表達。','給我幾個詞，我能自己組句。','不看提示，我也能說清楚。'][n]}</small>`,`data-rating="${s.id}:${n}"`,`aria-pressed="${r===n}"`)).join('')}</div></div>`;}).join('')}</section><section class="panel"><h2>留下一句具體回饋。</h2><p>老師與學生一起找出：這次做到了什麼，下次要多練習哪一步。</p></section>`;}
function homePage(){return head('', '先聽懂，再說自己的版本。答錯可以重選，沒有次數限制。')+`<div class="grid"><section class="panel"><h2>1. 聽懂關鍵資訊</h2>${quizzes.map((q,i)=>`<section style="margin:24px 0"><h3>${i+1}. ${esc(q.task)}</h3>${audio(q.line)}${transcript(q.line,q.zh)}<div class="actions">${q.options.map((o,j)=>btn(esc(o),`data-quiz="${q.id}:${j}"`,`aria-pressed="${quizChoices[q.id]===j}"`)).join('')}</div><div role="status">${quizChoices[q.id]!==undefined?`<p class="feedback ${quizChoices[q.id]===q.correct?'':'retry'}">${quizChoices[q.id]===q.correct?'✓ '+esc(q.why):'再聽一次，留意問題要的是地點、時間還是人物；也可以打開逐字稿再選。'}</p>`:''}</div></section>`).join('')}${check('data-home="listen"','我已練習聽懂關鍵資訊',state.home.listen)}</section><section class="panel"><h2>2. 說自己的版本</h2><p class="task">${esc(homeTask)}</p>${field('home','我的旅遊英文')}${hint('Where / meet · When / leave · Who / guide · museum entrance / ten / Ben',homeAnswer)}${check('data-home="written"','我已寫下自己的版本',state.home.written)}${check('data-home="spoken"','我已收起提示，大聲說一次',state.home.spoken)}<p id="homeProgress" class="status">${homeProgress()}</p><p class="fine">勾選表示你已練習，不是自動評分。</p></section></div>`;}
function homeProgress(){const n=Object.values(state.home).filter(Boolean).length;return `已練習 ${n} / ${Object.keys(state.home).length} 項${n===Object.keys(state.home).length?' · 課後挑戰完成 ✓':''}`;}
function render(){const views=[intro,phrasePage,scenePage,missionPage,pairPage,progressPage,homePage];$('#main').innerHTML=views[page]()+`<div class="footer-actions">${btn('← 上一部分',`data-page="${page-1}"`,page===0?'disabled':'')}${btn(page===6?'回到課前首頁':'下一部分 →',`data-page="${page===6?0:page+1}"`)}</div>`;$('#nav').innerHTML=course.labels.map((t,i)=>btn(`<span class="number">${String(i+1).padStart(2,'0')}</span>${esc(t)}`,`data-page="${i}"`,i===page?'aria-current="step"':'')).join('');showStorage();}
function focusMain(){ $('#main').focus({preventScroll:true}); }
function navigate(p){if(!Number.isInteger(p)||p<0||p>=course.labels.length)return;stopAudio();page=p;render();if(window.matchMedia('(max-width:1100px)').matches)$('#courseMenu').open=false;focusMain();window.scrollTo({top:0,behavior:'instant'});}
function resetTurn(){heard=false;spoken=false;choice=-1;feedback='';}
function start(i){if(!flows[i])return;flow=i;turn=0;history=[];finished=false;resetTurn();navigate(2);}
function choose(i){const t=currentStep();if(finished||!heard||!spoken||!Number.isInteger(i)||!t.objects[i])return;choice=i;history=history.slice(0,turn);if(accepted(t,i)){history[turn]=i;feedback=t.effect;}else feedback='再試一次：這個操作不符合目前的需要。重看中文任務，或重聽對方的話。';render();$(`[data-choice="${i}"]`).focus({preventScroll:true});}
function next(){if(!canNext())return;stopAudio();if(turn===flows[flow].steps.length-1){finished=true;if(!state.complete.includes(flows[flow].id))state.complete.push(flows[flow].id);save();}else{turn++;resetTurn();}render();focusMain();}
function back(){if(turn===0||finished)return;stopAudio();turn--;history=history.slice(0,turn);resetTurn();render();focusMain();}
function appearance(){const dark=document.documentElement.dataset.theme==='dark',large=document.documentElement.dataset.size==='large';$('#theme').textContent=dark?'☀ 淺色':'☾ 深色';$('#theme').setAttribute('aria-label',dark?'切換為淺色模式':'切換為深色模式');$('#theme').setAttribute('aria-pressed',String(dark));$('#large').textContent=large?'標準文字':'放大文字';$('#large').setAttribute('aria-pressed',String(large));}
document.addEventListener('input',e=>{const key=e.target.dataset.field;if(fields.includes(key)){state.answers[key]=e.target.value;save();}});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.pairCheck){const [id,i]=d.pairCheck.split(':'),p=pairs.find(p=>p.id===id);if(!p||!p.goals[+i])return;state.checks[id][+i]=e.target.checked;save();$('#pairProgress').textContent=`${state.checks[id].filter(Boolean).length} / ${p.goals.length} 項已做到`;return;}if(d.home&&Object.hasOwn(state.home,d.home)){state.home[d.home]=e.target.checked;save();$('#homeProgress').textContent=homeProgress();return;}if(['heard','spoken'].includes(e.target.id)){const id=e.target.id;if(currentStep().askFirst){if(id==='spoken')spoken=e.target.checked;else heard=spoken&&e.target.checked;if(!spoken)heard=false;}else{if(id==='heard')heard=e.target.checked;else spoken=heard&&e.target.checked;if(!heard)spoken=false;}choice=-1;feedback='';history=history.slice(0,turn);render();$('#'+id).focus({preventScroll:true});}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.say)return speak(d.say,d.slow==='true');if(d.page!==undefined)return navigate(+d.page);if(d.start!==undefined)return start(+d.start);if(d.choice!==undefined)return choose(+d.choice);if(d.act==='next')return next();if(d.act==='back')return back();if(d.mode&&['library','reply'].includes(d.mode)){stopAudio();mode=d.mode;render();$(`[data-mode="${mode}"]`).focus({preventScroll:true});return;}for(const key of ['reply','mission','pair'])if(d[key]!==undefined){const n=+d[key],list={reply:replies,mission:missions,pair:pairs}[key];if(!Number.isInteger(n)||!list[n])return;stopAudio();if(key==='reply')reply=n;if(key==='mission')mission=n;if(key==='pair')pair=n;render();$(`[data-${key}="${n}"]`).focus({preventScroll:true});return;}if(d.rating){const [id,n]=d.rating.split(':');if(!course.skills.some(s=>s.id===id)||![1,2,3].includes(+n))return;state.ratings[id]=+n;save();render();$(`[data-rating="${d.rating}"]`).focus({preventScroll:true});return;}if(d.quiz){const [id,n]=d.quiz.split(':'),q=quizzes.find(q=>q.id===id);if(!q||!q.options[+n])return;quizChoices[id]=+n;render();$(`[data-quiz="${d.quiz}"]`).focus({preventScroll:true});return;}if(b.id==='theme'||b.id==='large'){const theme=b.id==='theme',key=theme?'theme':'size',active=theme?'dark':'large',other=theme?'light':'standard';document.documentElement.dataset[key]=document.documentElement.dataset[key]===active?other:active;appearance();try{localStorage.setItem(theme?'travel-lab-theme':'travel-lab-text-size',document.documentElement.dataset[key]);}catch{toast('目前無法保存外觀設定，但本次切換仍有效。');}}});
window.addEventListener('pagehide',stopAudio);
load();render();appearance();
const compact=window.matchMedia('(max-width:1100px)');
const menuSync=()=>{$('#courseMenu').open=!compact.matches;};menuSync();compact.addEventListener('change',menuSync);
</script><script id="lesson-controls">
// Shared controls embedded in each lesson's app script.
(() => {
 let showChinese=false;
 const originalRender=render;
 const translations=()=>Array.from(document.querySelectorAll('#main details')).filter(el=>/中文/.test(el.querySelector('summary')?.textContent||''));
 function updateLabel(){
  const button=document.querySelector('#allChinese');
  if(!button)return;
  const items=translations(),all=items.length>0&&items.every(el=>el.open);
  button.textContent=all?'收起全部中文':'展開全部中文';
  button.setAttribute('aria-expanded',String(all));
 }
 function decorate(){
  const main=document.querySelector('#main');
  main.classList.toggle('lesson-phrase-page',page===1);
  if(page!==1)return;
  const heading=main.querySelector('h1');
  if(!heading)return;
  // Keep the same reading order in phrase cards and listening questions.
  translations().forEach(details=>{
   const parent=details.parentElement;
   const audio=Array.from(parent.children).find(el=>el.classList.contains('actions')&&el.querySelector('button'));
   if(!audio)return;
   const english=details.querySelector(':scope > p[lang="en"]')||parent.querySelector(':scope > p[lang="en"]');
   if(!english)return;
   audio.before(english);
   audio.after(details);
   english.classList.add('lesson-phrase-english');
   audio.classList.add('lesson-phrase-audio');
   details.classList.add('lesson-phrase-chinese');
   details.querySelector('summary').textContent='看中文意思';
  });
  const row=document.createElement('div');row.className='translation-heading';
  heading.before(row);row.append(heading);
  const button=document.createElement('button');button.id='allChinese';button.type='button';
  button.addEventListener('click',()=>{
   const items=translations();showChinese=!items.every(el=>el.open);
   items.forEach(el=>el.open=showChinese);updateLabel();
  });
  row.append(button);
  translations().forEach(el=>{el.open=showChinese;el.addEventListener('toggle',updateLabel);});
  updateLabel();
 }
 render=function(...args){originalRender(...args);decorate();};
 const style=document.createElement('style');
 style.textContent='.translation-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}.translation-heading h1{flex:1;min-width:min(100%,240px)}.translation-heading button{flex-shrink:0;min-height:44px;margin-left:auto}.lesson-audio-status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:1000;max-width:calc(100% - 32px);width:max-content;background:#202631;color:#fff;padding:12px 20px;border-radius:14px;box-shadow:0 4px 20px #0003}';
 document.head.append(style);
 const typography=document.createElement('style');
 typography.textContent=`
 #main.lesson-phrase-page{--lesson-text-size:17px;font-size:var(--lesson-text-size);line-height:1.7}
 :root[data-size=large] #main.lesson-phrase-page,body.large #main.lesson-phrase-page{--lesson-text-size:20px}
 #main.lesson-phrase-page .lesson-phrase-english{font-size:calc(var(--lesson-text-size)*1.28);line-height:1.6;font-weight:400;letter-spacing:normal;margin:0 0 18px;overflow-wrap:anywhere}
 #main.lesson-phrase-page .lesson-phrase-audio{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 16px}
 #main.lesson-phrase-page .lesson-phrase-audio button,#main.lesson-phrase-page .lesson-phrase-chinese{font-size:var(--lesson-text-size);line-height:1.7}
 #main.lesson-phrase-page .lesson-phrase-chinese{margin:0}
 #main.lesson-phrase-page .lesson-phrase-chinese summary,#main.lesson-phrase-page .lesson-phrase-chinese p:not(.fine){font-size:var(--lesson-text-size);line-height:1.7}
 @media(max-width:700px){#main.lesson-phrase-page .lesson-phrase-english{font-size:calc(var(--lesson-text-size)*1.2)}}
 `;
 document.head.append(typography);
 const status=document.createElement('div');status.className='lesson-audio-status';status.role='status';status.setAttribute('aria-live','polite');status.hidden=true;document.body.append(status);
 let current=null,version=0,watchdog=0,messageTimer=0;
 const message=(text,sticky=false)=>{clearTimeout(messageTimer);status.textContent=text;status.hidden=!text;if(text&&!sticky)messageTimer=setTimeout(()=>status.hidden=true,7000);};
 stopAudio=function(){
  version++;clearTimeout(watchdog);current=null;
  if(window.speechSynthesis)window.speechSynthesis.cancel();
  message('');
 };
 speak=function(text,slow=false){
  stopAudio();
  const synth=window.speechSynthesis;
  if(!synth||!window.SpeechSynthesisUtterance){message('此瀏覽器不支援朗讀。請改用 Edge 或 Chrome，或展開中文與英文繼續練習。');return;}
  const token=version;
  const voices=synth.getVoices().filter(v=>/^en(?:[-_]|$)/i.test(v.lang)).sort((a,b)=>Number(b.localService)-Number(a.localService));
  const candidates=voices.length?voices.slice(0,2):[null];
  function play(attempt){
   if(token!==version)return;
   clearTimeout(watchdog);
   const utterance=new window.SpeechSynthesisUtterance(text);current=utterance;
   utterance.lang=candidates[attempt]?.lang||'en-US';
   const normalRate=.9;
   utterance.rate=normalRate*(slow?.8:1);
   if(candidates[attempt])utterance.voice=candidates[attempt];
   const active=()=>token===version&&current===utterance;
   function failed(error){
    if(!active())return;
    clearTimeout(watchdog);current=null;
    if(['interrupted','canceled'].includes(error)){message('');return;}
    synth.cancel();
    if(attempt+1<candidates.length){play(attempt+1);return;}
    message('語音未能播放。請確認裝置音量，或換用 Edge／Chrome 重試；也可展開英文與中文繼續練習。');
   }
   utterance.onstart=()=>{if(active()){clearTimeout(watchdog);message(slow?'正在慢速朗讀…':'正在朗讀…',true);}};
   utterance.onend=()=>{if(active()){clearTimeout(watchdog);current=null;message('');}};
   utterance.onerror=e=>failed(e.error);
   message('正在準備朗讀…',true);
   watchdog=setTimeout(()=>failed('timeout'),5000);
   try{if(synth.paused)synth.resume();synth.speak(utterance);}catch{failed('synthesis-failed');}
  }
  play(0);
 };
 window.addEventListener('pagehide',()=>stopAudio());
 decorate();
})();
</script>
